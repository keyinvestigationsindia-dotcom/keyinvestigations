<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEY Investigations – Launching Soon</title>
  <meta name="description" content="KEY Investigations – Unlocking the Truth. India's premier insurance investigation & fraud detection agency. Launching soon." />
  <meta name="google-site-verification" content="G6f3No5otFiV34Bl7ytdn5jRnnTWcvN8E3giJmrwjGY" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: linear-gradient(145deg, #060a14 0%, #0a0f1e 30%, #0f1f3d 60%, #0d1a30 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .grid-overlay {
      position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .glow-1 {
      position: absolute; top: 20%; right: 10%; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      border-radius: 50%; animation: float 8s ease-in-out infinite;
    }
    .glow-2 {
      position: absolute; bottom: 20%; left: 5%; width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(30,80,180,0.05) 0%, transparent 70%);
      border-radius: 50%; animation: float 8s ease-in-out infinite; animation-delay: -4s;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .container {
      text-align: center; position: relative; z-index: 1;
      animation: fadeUp 1s ease forwards;
      padding: 2rem;
    }
    .logo-box {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #c9a84c, #e2c17a);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(201,168,76,0.25);
    }
    .logo-box span {
      font-family: Georgia, serif; font-weight: 900; font-size: 22px;
      color: #0a0f1e;
    }
    .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.5rem; font-weight: 900; color: white;
      margin-bottom: 0.5rem; letter-spacing: -0.02em;
    }
    .brand em {
      font-style: normal;
      background: linear-gradient(135deg, #c9a84c, #e2c17a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      color: rgba(201,168,76,0.6); font-size: 0.75rem;
      font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase;
      margin-bottom: 3rem;
    }
    .launching {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 14px 32px; border-radius: 100px;
      margin-bottom: 2.5rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #c9a84c; animation: pulse 2s ease infinite;
      box-shadow: 0 0 12px rgba(201,168,76,0.5);
    }
    .launching span {
      color: white; font-size: 1rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .desc {
      color: rgba(255,255,255,0.3); font-size: 0.95rem;
      max-width: 460px; margin: 0 auto 3rem; line-height: 1.7;
    }
    .contact-row {
      display: flex; align-items: center; justify-content: center;
      gap: 2rem; flex-wrap: wrap;
    }
    .contact-row a {
      color: rgba(255,255,255,0.25); font-size: 0.85rem;
      text-decoration: none; transition: color 0.3s;
    }
    .contact-row a:hover { color: #c9a84c; }
    .divider {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .bottom {
      position: fixed; bottom: 2rem; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.1); font-size: 0.7rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    .clock {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 5rem; font-weight: 200;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(201,168,76,0.7));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
      line-height: 1;
    }
    .clock-date {
      color: rgba(255,255,255,0.15);
      font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.25em; text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    @media (max-width: 640px) {
      .clock { font-size: 3rem; }
      .brand { font-size: 1.75rem; }
      .launching { padding: 12px 24px; }
      .launching span { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="logo-box"><span>KI</span></div>
    <h1 class="brand"><em>KEY</em> Investigations</h1>
    <p class="tagline">Unlocking the Truth</p>

    <div id="liveClock" class="clock"></div>
    <div id="clockDate" class="clock-date"></div>

    <div class="launching">
      <div class="dot"></div>
      <span>Launching Soon</span>
    </div>

    <p class="desc">India's premier insurance investigation and fraud detection agency. We are building something exceptional. Stay tuned.</p>

    <div class="contact-row">
      <a href="mailto:info@keyinvestigations.in">info@keyinvestigations.in</a>
      <div class="divider"></div>
      <a href="https://wa.me/?text=Hi%2C%20I%20need%20investigation%20services." target="_blank">WhatsApp</a>
    </div>
  </div>

  <div class="bottom">&copy; 2026 KEY Investigations</div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2,'0');
      const m = now.getMinutes().toString().padStart(2,'0');
      const s = now.getSeconds().toString().padStart(2,'0');
      document.getElementById('liveClock').textContent = h + ' : ' + m + ' : ' + s;

      const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
      document.getElementById('clockDate').textContent = now.toLocaleDateString('en-IN', options);
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
