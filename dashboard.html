<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Client Dashboard – KEY Investigations</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0a0f1e'},gold:{DEFAULT:'#c9a84c',light:'#e2c17a'}}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>html{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="header"></div>
<main class="max-w-7xl mx-auto px-6 py-8">
  <!-- Workspace picker (if multiple) -->
  <div id="workspacePicker" class="hidden mb-6">
    <label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Workspace</label>
    <select id="wsSelect" onchange="switchWorkspace(this.value)" class="border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-navy focus:outline-none focus:border-gold bg-white min-w-[240px]"></select>
  </div>
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-navy">Claims Dashboard</h1>
      <p id="sub" class="text-slate-400 text-sm mt-0.5">Loading...</p>
    </div>
    <button onclick="openModal()" class="bg-gold hover:bg-gold-light text-navy font-bold px-5 py-2.5 rounded-xl text-sm flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>New Claim
    </button>
  </div>
  <div id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>
  <div class="flex flex-wrap gap-2 mb-5" id="filters"></div>
  <div id="table" class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="p-12 text-center text-slate-400 text-sm">Loading claims...</div>
  </div>
  <!-- Tenant Members (admin only) -->
  <div id="membersSection" class="hidden mt-10">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-navy">Workspace Members</h2>
      <button onclick="openInvite()" class="text-sm bg-navy text-white px-4 py-2 rounded-lg">+ Invite User</button>
    </div>
    <div id="membersList" class="bg-white rounded-2xl border border-slate-200 overflow-hidden"></div>
  </div>
</main>

<!-- NEW CLAIM MODAL -->
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-navy/70 backdrop-blur-sm">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between px-6 py-5 border-b"><h2 class="font-bold text-navy text-lg">New Investigation Request</h2><button onclick="closeModal()" class="text-slate-400">✕</button></div>
    <div class="p-6">
      <div id="step1">
        <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-3">Select Claim Type</p>
        <div id="typeGrid" class="grid grid-cols-2 gap-3"></div>
      </div>
      <div id="step2" class="hidden space-y-4">
        <button onclick="backStep()" class="text-xs text-slate-400 hover:text-navy flex items-center gap-1 mb-2">← Change type</button>
        <div id="dynForm" class="space-y-4"></div>
        <button onclick="submitClaim()" class="w-full bg-gold text-navy font-bold py-3 rounded-xl mt-2">Submit Request</button>
      </div>
    </div>
  </div>
</div>

<!-- INVITE MODAL -->
<div id="inviteModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-navy/70 backdrop-blur-sm">
  <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl p-6">
    <div class="flex items-center justify-between mb-5"><h2 class="font-bold text-navy">Invite User to Workspace</h2><button onclick="closeInvite()" class="text-slate-400">✕</button></div>
    <div id="inviteAlert" class="hidden mb-4 p-3 rounded-xl text-sm"></div>
    <div class="space-y-4">
      <div><label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Email Address</label>
        <input id="inviteEmail" type="email" placeholder="user@company.com" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold"/></div>
      <div><label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Full Name</label>
        <input id="inviteName" type="text" placeholder="Full name" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold"/></div>
      <div><label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Role</label>
        <select id="inviteRole" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
          <option value="member">Member</option><option value="admin">Admin</option>
        </select></div>
      <button onclick="inviteUser()" class="w-full bg-gold text-navy font-bold py-3 rounded-xl">Send Invite</button>
    </div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-navy/40" onclick="closeDrawer()"></div>
  <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl overflow-y-auto">
    <div class="sticky top-0 bg-white border-b px-6 py-5 flex items-center justify-between">
      <h2 class="font-bold text-navy" id="drawerTitle">Claim Details</h2>
      <button onclick="closeDrawer()" class="text-slate-400">✕</button>
    </div>
    <div id="drawerBody" class="p-6"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
let allClaims=[], claimTypes=[], currentTenantId=null, workspaces=[], selectedType=null, isAdmin=false;
const STATUSES=['pending','assigned','in_progress','under_review','qc_review','rfi_raised','resolved'];

(async()=>{
  const session=await getSession(); if(!session) return window.location.href='login.html';
  const profile=await getProfile(session.user.id);
  if(profile.system_role!=='external') return window.location.href=ROLE_ROUTES[profile.system_role];
  workspaces=await getWorkspaces(session.user.id);
  if(!workspaces.length){ document.getElementById('sub').textContent='You are not part of any workspace yet. Contact your admin.'; return; }
  currentTenantId=workspaces[0].tenant_id;
  isAdmin=workspaces[0].workspace_role==='admin';
  document.getElementById('header').innerHTML=buildHeader(profile, workspaces[0].tenants?.name);
  if(workspaces.length>1){
    document.getElementById('workspacePicker').classList.remove('hidden');
    document.getElementById('wsSelect').innerHTML=workspaces.map(w=>`<option value="${w.tenant_id}">${w.tenants?.name}</option>`).join('');
  }
  const {data:types}=await sb.from('claim_types').select('*');
  claimTypes=types||[];
  if(isAdmin){ document.getElementById('membersSection').classList.remove('hidden'); await loadMembers(); }
  await loadClaims();
})();

async function switchWorkspace(tid){
  currentTenantId=tid;
  const ws=workspaces.find(w=>w.tenant_id===tid);
  isAdmin=ws?.workspace_role==='admin';
  if(isAdmin){ document.getElementById('membersSection').classList.remove('hidden'); await loadMembers(); }
  else document.getElementById('membersSection').classList.add('hidden');
  await loadClaims();
}

async function loadClaims(){
  document.getElementById('sub').textContent=workspaces.find(w=>w.tenant_id===currentTenantId)?.tenants?.name+' · All claims';
  const {data}=await sb.from('claims')
    .select('*, claim_types(label), profiles!claims_agent_id_fkey(full_name)')
    .eq('tenant_id',currentTenantId).order('created_at',{ascending:false});
  allClaims=data||[];
  renderStats(); renderFilters(); renderTable(allClaims);
}

function renderStats(){
  const counts={total:allClaims.length,pending:0,assigned:0,in_progress:0,resolved:0};
  allClaims.forEach(c=>{ if(counts[c.status]!==undefined) counts[c.status]++; });
  document.getElementById('stats').innerHTML=[
    ['Total',counts.total,'text-navy'],['Pending',counts.pending,'text-slate-500'],
    ['Assigned',counts.assigned,'text-blue-600'],['In Progress',counts.in_progress,'text-amber-500'],
    ['Resolved',counts.resolved,'text-green-600']
  ].map(([l,n,c])=>`<div class="bg-white border border-slate-200 rounded-xl p-4 text-center"><div class="text-2xl font-bold ${c}">${n}</div><div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">${l}</div></div>`).join('');
}

function renderFilters(){
  const counts={};
  allClaims.forEach(c=>{ counts[c.status]=(counts[c.status]||0)+1; });
  document.getElementById('filters').innerHTML=`<button onclick="applyFilter('all')" id="f-all" class="fx active px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white">All (${allClaims.length})</button>`+
    STATUSES.filter(s=>counts[s]).map(s=>`<button onclick="applyFilter('${s}')" id="f-${s}" class="fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">${STATUS_LABELS[s]} (${counts[s]||0})</button>`).join('');
}

function applyFilter(s){
  document.querySelectorAll('.fx').forEach(b=>b.className='fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600');
  document.getElementById('f-'+s).className='fx px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white';
  renderTable(s==='all'?allClaims:allClaims.filter(c=>c.status===s));
}

function renderTable(claims){
  if(!claims.length){ document.getElementById('table').innerHTML='<div class="p-16 text-center text-slate-400 text-sm">No claims found</div>'; return; }
  document.getElementById('table').innerHTML=`<div class="overflow-x-auto"><table class="w-full min-w-[700px]">
    <thead class="bg-slate-50 border-b"><tr>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Claim No.</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Type</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Location</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Status</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Agent</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Date</th>
      <th></th>
    </tr></thead>
    <tbody class="divide-y divide-slate-50">
      ${claims.map(c=>`<tr class="hover:bg-slate-50 cursor-pointer" onclick="openDrawer('${c.id}')">
        <td class="px-5 py-4 font-mono text-sm font-semibold text-navy">${c.claim_number}</td>
        <td class="px-5 py-4 text-sm"><span class="flex items-center gap-2">${TYPE_ICONS[c.claim_type_id]||'📋'} ${c.claim_types?.label||c.claim_type_id}</span></td>
        <td class="px-5 py-4 text-sm text-slate-500">${c.location_city||'–'}, ${c.location_state||''}</td>
        <td class="px-5 py-4">${pill(STATUS_LABELS[c.status]||c.status, STATUS_COLORS[c.status]||'')}</td>
        <td class="px-5 py-4 text-sm text-slate-500">${c.profiles?.full_name||'Unassigned'}</td>
        <td class="px-5 py-4 text-xs text-slate-400">${formatDate(c.created_at)}</td>
        <td class="px-5 py-4"><svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

// MEMBERS
async function loadMembers(){
  const {data}=await sb.from('workspace_members').select('*, profiles(full_name,email,system_role)').eq('tenant_id',currentTenantId);
  document.getElementById('membersList').innerHTML=`<table class="w-full">
    <thead class="bg-slate-50 border-b"><tr>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Name</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Email</th>
      <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Role</th>
    </tr></thead>
    <tbody class="divide-y divide-slate-50">
      ${(data||[]).map(m=>`<tr>
        <td class="px-5 py-4 font-medium text-navy text-sm">${m.profiles?.full_name||'–'}</td>
        <td class="px-5 py-4 text-sm text-slate-500">${m.profiles?.email||'–'}</td>
        <td class="px-5 py-4">${pill(m.workspace_role,m.workspace_role==='admin'?'bg-gold/10 text-gold':'bg-slate-100 text-slate-600')}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

function openInvite(){ document.getElementById('inviteModal').classList.remove('hidden'); document.getElementById('inviteModal').classList.add('flex'); }
function closeInvite(){ document.getElementById('inviteModal').classList.add('hidden'); document.getElementById('inviteModal').classList.remove('flex'); }
async function inviteUser(){
  const email=document.getElementById('inviteEmail').value;
  const name=document.getElementById('inviteName').value;
  const role=document.getElementById('inviteRole').value;
  const al=document.getElementById('inviteAlert');
  // Check if user exists
  const {data:existing}=await sb.from('profiles').select('id').eq('email',email).single();
  if(!existing){ al.className='mb-4 p-3 rounded-xl text-sm bg-red-50 text-red-600'; al.textContent='User not found. Ask them to register first at keyinvestigations.in/login.html'; al.classList.remove('hidden'); return; }
  const session=await getSession();
  const {error}=await sb.from('workspace_members').insert({tenant_id:currentTenantId,user_id:existing.id,workspace_role:role,invited_by:session.user.id});
  if(error){ al.className='mb-4 p-3 rounded-xl text-sm bg-red-50 text-red-600'; al.textContent=error.message; al.classList.remove('hidden'); return; }
  al.className='mb-4 p-3 rounded-xl text-sm bg-green-50 text-green-600'; al.textContent='User added to workspace!'; al.classList.remove('hidden');
  await loadMembers();
}

// CLAIM MODAL
function openModal(){ document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex');
  document.getElementById('typeGrid').innerHTML=claimTypes.map(t=>`<button onclick="selectType('${t.id}')" class="text-left p-4 border-2 border-slate-100 rounded-xl hover:border-gold group">
    <div class="text-2xl mb-2">${TYPE_ICONS[t.id]||'📋'}</div>
    <div class="font-semibold text-navy text-sm group-hover:text-gold">${t.label}</div>
    <div class="text-xs text-slate-400 mt-1">${t.description||''}</div>
  </button>`).join('');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
function backStep(){ document.getElementById('step1').classList.remove('hidden'); document.getElementById('step2').classList.add('hidden'); }

function selectType(tid){
  selectedType=claimTypes.find(t=>t.id===tid);
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  const schema=typeof selectedType.form_schema==='string'?JSON.parse(selectedType.form_schema):selectedType.form_schema;
  document.getElementById('dynForm').innerHTML=`<h3 class="font-semibold text-navy">${selectedType.label}</h3>`+
    schema.map(f=>`<div>
      <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">${f.label}${f.required?' <span class="text-red-400">*</span>':''}</label>
      ${f.type==='textarea'?`<textarea name="${f.name}" rows="3" ${f.required?'required':''} placeholder="${f.label}" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold resize-none"></textarea>`
        :f.type==='select'?`<select name="${f.name}" ${f.required?'required':''} class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold"><option value="">Select...</option>${(f.options||[]).map(o=>`<option>${o}</option>`).join('')}</select>`
        :`<input type="${f.type}" name="${f.name}" ${f.required?'required':''} placeholder="${f.label}" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-gold"/>`}
    </div>`).join('');
}

async function submitClaim(){
  const session=await getSession();
  const schema=typeof selectedType.form_schema==='string'?JSON.parse(selectedType.form_schema):selectedType.form_schema;
  const form=document.getElementById('dynForm'); const fd={};
  let state='',city='';
  schema.forEach(f=>{ const el=form.querySelector(`[name="${f.name}"]`); if(el){ fd[f.name]=el.value; if(f.name.includes('state')) state=el.value; if(f.name.includes('city')) city=el.value; } });
  const {error}=await sb.from('claims').insert({tenant_id:currentTenantId,created_by:session.user.id,claim_type_id:selectedType.id,form_data:fd,location_state:state,location_city:city,status:'pending'});
  if(error){alert('Error: '+error.message);return;}
  closeModal(); await loadClaims();
}

// DRAWER
function openDrawer(id){
  const c=allClaims.find(x=>x.id===id); if(!c) return;
  const fd=c.form_data||{};
  document.getElementById('drawerTitle').textContent=c.claim_number;
  document.getElementById('drawerBody').innerHTML=`
    <div class="flex items-center gap-3 mb-6"><span class="text-3xl">${TYPE_ICONS[c.claim_type_id]||'📋'}</span>
      <div><div class="font-semibold text-navy">${c.claim_types?.label||c.claim_type_id}</div>
        <div class="text-xs text-slate-400 mt-0.5">${formatDate(c.created_at)}</div></div>
      ${pill(STATUS_LABELS[c.status]||c.status,STATUS_COLORS[c.status]||'')}
    </div>
    ${c.profiles?.full_name?`<div class="bg-blue-50 rounded-xl p-4 mb-5 flex items-center gap-3">
      <span class="text-xl">👤</span><div><div class="text-xs text-blue-500 font-semibold uppercase tracking-wider">Assigned Agent</div>
        <div class="font-medium text-navy text-sm">${c.profiles.full_name}</div></div></div>`:''}
    <div class="grid grid-cols-2 gap-3">
      ${Object.entries(fd).filter(([,v])=>v).map(([k,v])=>`<div class="bg-slate-50 rounded-xl p-3">
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">${k.replace(/_/g,' ')}</div>
        <div class="text-sm font-medium text-navy">${v}</div></div>`).join('')}
    </div>
    ${c.agent_notes?`<div class="mt-5 bg-amber-50 border border-amber-100 rounded-xl p-4">
      <div class="text-xs font-bold uppercase tracking-wider text-amber-600 mb-1">Agent Notes</div>
      <p class="text-sm text-amber-800">${c.agent_notes}</p></div>`:''}`;
  document.getElementById('drawer').classList.remove('hidden');
}
function closeDrawer(){ document.getElementById('drawer').classList.add('hidden'); }
</script></body></html>
