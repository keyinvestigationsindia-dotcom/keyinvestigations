<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard – KEY Investigations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0a0f1e'},gold:{DEFAULT:'#c9a84c',light:'#e2c17a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>html{font-family:'Inter',system-ui,sans-serif;} .fade-in{animation:fadeIn .4s ease forwards} @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- HEADER -->
<header class="bg-navy border-b border-white/10 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="index.html" class="flex items-center gap-1">
        <span class="text-gold font-bold text-lg" style="font-family:'Georgia',serif">KEY</span>
        <span class="text-white font-medium text-sm">Investigations</span>
      </a>
      <span class="text-white/20">|</span>
      <span id="companyName" class="text-white/60 text-sm font-medium"></span>
    </div>
    <div class="flex items-center gap-3">
      <div id="avatarEl" class="w-8 h-8 bg-gold rounded-full flex items-center justify-center text-navy text-xs font-bold"></div>
      <span id="userName" class="text-white/80 text-sm hidden sm:block"></span>
      <button onclick="signOut()" class="text-white/40 hover:text-white text-xs border border-white/10 px-3 py-1.5 rounded-lg transition-colors">Sign out</button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-6 py-8">

  <!-- Welcome + New Claim button -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-navy">Claims Dashboard</h1>
      <p id="welcomeSub" class="text-slate-400 text-sm mt-0.5"></p>
    </div>
    <button onclick="openNewClaim()" class="bg-gold hover:bg-gold-light text-navy font-bold px-5 py-2.5 rounded-xl text-sm transition-all hover:-translate-y-0.5 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      New Claim
    </button>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8" id="statsRow"></div>

  <!-- Filters -->
  <div class="flex flex-wrap gap-2 mb-5">
    <button onclick="filterClaims('all')" id="filter-all" class="filter-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white">All</button>
    <button onclick="filterClaims('pending')" id="filter-pending" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Pending</button>
    <button onclick="filterClaims('assigned')" id="filter-assigned" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Assigned</button>
    <button onclick="filterClaims('in_progress')" id="filter-in_progress" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">In Progress</button>
    <button onclick="filterClaims('resolved')" id="filter-resolved" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200">Resolved</button>
  </div>

  <!-- Claims Table -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden" id="claimsTable">
    <div class="p-12 text-center text-slate-400 text-sm">Loading claims...</div>
  </div>
</main>

<!-- NEW CLAIM MODAL -->
<div id="claimModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-navy/70 backdrop-blur-sm">
  <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
      <h2 class="font-bold text-navy text-lg">New Investigation Request</h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-navy">✕</button>
    </div>
    <div class="p-6 space-y-5">
      <!-- Step 1: Claim Type -->
      <div id="step1">
        <label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-3">Select Claim Type</label>
        <div class="grid grid-cols-2 gap-3" id="claimTypeGrid"></div>
      </div>
      <!-- Step 2: Dynamic Form -->
      <div id="step2" class="hidden">
        <button onclick="backToStep1()" class="text-xs text-slate-400 hover:text-navy flex items-center gap-1 mb-4">← Change type</button>
        <div id="dynamicForm" class="space-y-4"></div>
        <button onclick="submitClaim()" class="w-full bg-gold hover:bg-gold-light text-navy font-bold py-3 rounded-xl mt-4 transition-all">Submit Investigation Request</button>
      </div>
    </div>
  </div>
</div>

<!-- CLAIM DETAIL MODAL -->
<div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-navy/70 backdrop-blur-sm">
  <div class="bg-white rounded-2xl w-full max-w-xl max-h-[85vh] overflow-y-auto shadow-2xl">
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
      <h2 class="font-bold text-navy text-lg" id="detailTitle">Claim Details</h2>
      <button onclick="closeDetail()" class="text-slate-400 hover:text-navy">✕</button>
    </div>
    <div id="detailBody" class="p-6"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
let allClaims = [], claimTypes = [], selectedType = null, currentFilter = 'all';
const STATUS_COLORS = {pending:'bg-slate-100 text-slate-600',assigned:'bg-blue-50 text-blue-700',in_progress:'bg-amber-50 text-amber-700',under_review:'bg-purple-50 text-purple-700',resolved:'bg-green-50 text-green-700',closed:'bg-slate-50 text-slate-400'};
const STATUS_LABELS = {pending:'Pending',assigned:'Assigned',in_progress:'In Progress',under_review:'Under Review',resolved:'Resolved',closed:'Closed'};
const TYPE_ICONS = {motor_od:'🚗',motor_theft:'🔓',health:'🏥',mact:'⚖️',tp:'🤝',non_motor:'🏢'};

(async () => {
  const session = await getSession();
  if (!session) return window.location.href = 'login.html';
  const profile = await getProfile(session.user.id);
  if (!profile) return window.location.href = 'login.html';
  if (profile.role === 'agent') return window.location.href = 'agent.html';

  document.getElementById('avatarEl').textContent = avatar(profile.full_name);
  document.getElementById('userName').textContent = profile.full_name || session.user.email;
  document.getElementById('companyName').textContent = profile.companies?.name || '';
  document.getElementById('welcomeSub').textContent = `${profile.companies?.name || ''} · All investigation requests`;

  // Load claim types
  const { data: types } = await sb.from('claim_types').select('*').order('id');
  claimTypes = types || [];

  // Load claims
  await loadClaims();
})();

async function loadClaims() {
  const { data } = await sb.from('claims')
    .select('*, claim_types(label), profiles!claims_agent_id_fkey(full_name)')
    .order('created_at', { ascending: false });
  allClaims = data || [];
  renderStats();
  renderClaims(allClaims);
}

function renderStats() {
  const counts = { total: allClaims.length, pending: 0, assigned: 0, in_progress: 0, resolved: 0 };
  allClaims.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });
  document.getElementById('statsRow').innerHTML = `
    <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-navy">${counts.total}</div>
      <div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Total</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-slate-500">${counts.pending}</div>
      <div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Pending</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-blue-600">${counts.assigned}</div>
      <div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Assigned</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-amber-500">${counts.in_progress}</div>
      <div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">In Progress</div>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-4 text-center">
      <div class="text-2xl font-bold text-green-600">${counts.resolved}</div>
      <div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Resolved</div>
    </div>`;
}

function renderClaims(claims) {
  if (!claims.length) {
    document.getElementById('claimsTable').innerHTML = '<div class="p-16 text-center text-slate-400 text-sm">No claims found</div>';
    return;
  }
  document.getElementById('claimsTable').innerHTML = `
    <table class="w-full">
      <thead class="bg-slate-50 border-b border-slate-100">
        <tr>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Claim No.</th>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Type</th>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400 hidden md:table-cell">Location</th>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400">Status</th>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400 hidden sm:table-cell">Agent</th>
          <th class="text-left px-5 py-3 text-xs font-bold uppercase tracking-wider text-slate-400 hidden lg:table-cell">Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-50">
        ${claims.map(c => `
          <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="showDetail('${c.id}')">
            <td class="px-5 py-4 font-mono text-sm font-semibold text-navy">${c.claim_number}</td>
            <td class="px-5 py-4 text-sm">
              <span class="flex items-center gap-2">
                <span>${TYPE_ICONS[c.claim_type_id] || '📋'}</span>
                <span class="text-slate-700">${c.claim_types?.label || c.claim_type_id}</span>
              </span>
            </td>
            <td class="px-5 py-4 text-sm text-slate-500 hidden md:table-cell">${c.location_city || '–'}, ${c.location_state || ''}</td>
            <td class="px-5 py-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${STATUS_COLORS[c.status] || 'bg-slate-100 text-slate-600'}">${STATUS_LABELS[c.status] || c.status}</span>
            </td>
            <td class="px-5 py-4 text-sm text-slate-500 hidden sm:table-cell">${c.profiles?.full_name || '–'}</td>
            <td class="px-5 py-4 text-xs text-slate-400 hidden lg:table-cell">${formatDate(c.created_at)}</td>
            <td class="px-5 py-4"><svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function filterClaims(status) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200';
  });
  document.getElementById('filter-' + status).className = 'filter-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white';
  renderClaims(status === 'all' ? allClaims : allClaims.filter(c => c.status === status));
}

// ---- NEW CLAIM MODAL ----
function openNewClaim() {
  document.getElementById('claimModal').classList.remove('hidden');
  document.getElementById('claimModal').classList.add('flex');
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('claimTypeGrid').innerHTML = claimTypes.map(t => `
    <button onclick="selectType('${t.id}')" class="text-left p-4 border-2 border-slate-100 rounded-xl hover:border-gold transition-all group">
      <div class="text-2xl mb-2">${TYPE_ICONS[t.id] || '📋'}</div>
      <div class="font-semibold text-navy text-sm group-hover:text-gold transition-colors">${t.label}</div>
      <div class="text-xs text-slate-400 mt-1">${t.description || ''}</div>
    </button>`).join('');
}
function closeModal() {
  document.getElementById('claimModal').classList.add('hidden');
  document.getElementById('claimModal').classList.remove('flex');
}
function backToStep1() {
  selectedType = null;
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2').classList.add('hidden');
}

function selectType(typeId) {
  selectedType = claimTypes.find(t => t.id === typeId);
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  const schema = typeof selectedType.form_schema === 'string' ? JSON.parse(selectedType.form_schema) : selectedType.form_schema;
  document.getElementById('dynamicForm').innerHTML = `
    <h3 class="font-semibold text-navy text-base mb-1">${selectedType.label}</h3>
    <p class="text-slate-400 text-xs mb-4">${selectedType.description || ''}</p>
    ${schema.map(field => `
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">
          ${field.label}${field.required ? ' <span class="text-red-400">*</span>' : ''}
        </label>
        ${field.type === 'textarea'
          ? `<textarea name="${field.name}" rows="3" ${field.required ? 'required' : ''} placeholder="${field.label}" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-navy focus:outline-none focus:border-gold resize-none"></textarea>`
          : field.type === 'select'
          ? `<select name="${field.name}" ${field.required ? 'required' : ''} class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-navy focus:outline-none focus:border-gold">
               <option value="">Select...</option>
               ${(field.options || []).map(o => `<option>${o}</option>`).join('')}
             </select>`
          : `<input type="${field.type}" name="${field.name}" ${field.required ? 'required' : ''} placeholder="${field.label}" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-navy focus:outline-none focus:border-gold" />`
        }
      </div>`).join('')}`;
}

async function submitClaim() {
  const session = await getSession();
  const profile = await getProfile(session.user.id);
  const schema = typeof selectedType.form_schema === 'string' ? JSON.parse(selectedType.form_schema) : selectedType.form_schema;
  const form = document.getElementById('dynamicForm');
  const formData = {};
  let locationState = '', locationCity = '';

  for (const field of schema) {
    const el = form.querySelector(`[name="${field.name}"]`);
    if (el) {
      formData[field.name] = el.value;
      if (field.name.includes('state')) locationState = el.value;
      if (field.name.includes('city')) locationCity = el.value;
    }
  }

  const { error } = await sb.from('claims').insert({
    company_id: profile.company_id,
    client_id: session.user.id,
    claim_type_id: selectedType.id,
    form_data: formData,
    location_state: locationState,
    location_city: locationCity,
    status: 'pending'
  });

  if (error) { alert('Error: ' + error.message); return; }
  closeModal();
  await loadClaims();
}

// ---- DETAIL MODAL ----
function showDetail(id) {
  const claim = allClaims.find(c => c.id === id);
  if (!claim) return;
  document.getElementById('detailTitle').textContent = claim.claim_number;
  const fd = claim.form_data || {};
  document.getElementById('detailBody').innerHTML = `
    <div class="flex items-center gap-3 mb-6">
      <span class="text-3xl">${TYPE_ICONS[claim.claim_type_id] || '📋'}</span>
      <div>
        <div class="font-semibold text-navy">${claim.claim_types?.label || claim.claim_type_id}</div>
        <div class="text-xs text-slate-400 mt-0.5">${formatDate(claim.created_at)}</div>
      </div>
      <span class="ml-auto px-3 py-1 rounded-full text-xs font-semibold ${STATUS_COLORS[claim.status]}">${STATUS_LABELS[claim.status]}</span>
    </div>
    ${claim.profiles?.full_name ? `
    <div class="bg-blue-50 rounded-xl p-4 mb-5 flex items-center gap-3">
      <span class="text-xl">👤</span>
      <div>
        <div class="text-xs text-blue-500 font-semibold uppercase tracking-wider">Assigned Agent</div>
        <div class="font-medium text-navy text-sm">${claim.profiles.full_name}</div>
      </div>
    </div>` : ''}
    <div class="grid grid-cols-2 gap-3">
      ${Object.entries(fd).map(([k, v]) => v ? `
        <div class="bg-slate-50 rounded-xl p-3">
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">${k.replace(/_/g,' ')}</div>
          <div class="text-sm font-medium text-navy">${v}</div>
        </div>` : '').join('')}
    </div>
    ${claim.agent_notes ? `<div class="mt-5 bg-amber-50 border border-amber-100 rounded-xl p-4">
      <div class="text-xs font-bold uppercase tracking-wider text-amber-600 mb-1">Agent Notes</div>
      <p class="text-sm text-amber-800">${claim.agent_notes}</p>
    </div>` : ''}`;
  document.getElementById('detailModal').classList.remove('hidden');
  document.getElementById('detailModal').classList.add('flex');
}
function closeDetail() {
  document.getElementById('detailModal').classList.add('hidden');
  document.getElementById('detailModal').classList.remove('flex');
}
</script>
</body>
</html>
