<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login – KEY Investigations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0a0f1e', 800: '#0f1729' },
            gold: { DEFAULT: '#c9a84c', light: '#e2c17a' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Playfair Display', 'serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    html { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Playfair Display', Georgia, serif; }
    .hero-bg { background: linear-gradient(135deg, #0a0f1e 0%, #0f1f3d 50%, #1a1040 100%); }
    .grid-overlay { background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
  </style>
</head>
<body class="hero-bg min-h-screen flex flex-col">
  <div class="grid-overlay fixed inset-0 pointer-events-none"></div>

  <!-- Header -->
  <div class="relative px-6 py-5">
    <a href="index.html" class="flex items-center gap-1 w-fit">
      <span class="font-display text-xl font-bold text-gold">KEY</span>
      <span class="text-white font-medium">Investigations</span>
    </a>
  </div>

  <!-- Auth box -->
  <div class="relative flex-1 flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md">
      <div class="bg-white/[0.05] backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl">

        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-12 h-12 bg-gold/10 border border-gold/20 rounded-xl mb-4 text-xl">🔐</div>
          <h1 class="font-display text-2xl font-bold text-white mb-1">Customer Portal</h1>
          <p class="text-white/40 text-sm">Sign in to track your investigation cases</p>
        </div>

        <!-- Tabs -->
        <div class="flex bg-white/5 rounded-xl p-1 mb-7">
          <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-navy">Sign In</button>
          <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-white/50 hover:text-white">Register</button>
        </div>

        <!-- Alerts -->
        <div id="alert-box" class="hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium"></div>

        <!-- LOGIN PANEL -->
        <div id="panel-login">
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Email Address</label>
              <input type="email" id="login-email" required placeholder="your@email.com"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
            </div>
            <div>
              <div class="flex justify-between mb-2">
                <label class="text-white/50 text-xs font-bold uppercase tracking-widest">Password</label>
                <button type="button" onclick="switchTab('reset')" class="text-white/30 hover:text-gold text-xs transition-colors">Forgot?</button>
              </div>
              <input type="password" id="login-password" required placeholder="••••••••"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
            </div>
            <button type="submit" id="login-btn" class="w-full bg-gold hover:bg-gold-light text-navy font-bold py-3.5 rounded-xl transition-all hover:-translate-y-0.5 mt-2">
              Sign In
            </button>
          </form>
        </div>

        <!-- SIGNUP PANEL -->
        <div id="panel-signup" class="hidden">
          <form id="signupForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Full Name</label>
                <input type="text" id="signup-name" required placeholder="Your name"
                  class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
              </div>
              <div>
                <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Company</label>
                <input type="text" id="signup-company" placeholder="Insurer name"
                  class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
              </div>
            </div>
            <div>
              <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Email Address</label>
              <input type="email" id="signup-email" required placeholder="your@email.com"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
            </div>
            <div>
              <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Password</label>
              <input type="password" id="signup-password" required placeholder="Min. 8 characters" minlength="8"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
            </div>
            <button type="submit" id="signup-btn" class="w-full bg-gold hover:bg-gold-light text-navy font-bold py-3.5 rounded-xl transition-all hover:-translate-y-0.5 mt-2">
              Create Account
            </button>
          </form>
        </div>

        <!-- RESET PANEL -->
        <div id="panel-reset" class="hidden">
          <p class="text-white/50 text-sm mb-5">Enter your email and we'll send a reset link.</p>
          <form id="resetForm" class="space-y-4">
            <div>
              <label class="text-white/50 text-xs font-bold uppercase tracking-widest block mb-2">Email Address</label>
              <input type="email" id="reset-email" required placeholder="your@email.com"
                class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-gold/60 transition-colors" />
            </div>
            <button type="submit" class="w-full bg-gold hover:bg-gold-light text-navy font-bold py-3.5 rounded-xl transition-all mt-2">Send Reset Link</button>
            <button type="button" onclick="switchTab('login')" class="w-full text-white/30 hover:text-white text-sm transition-colors">← Back to Sign In</button>
          </form>
        </div>

      </div>
      <a href="index.html" class="block text-center mt-6 text-white/30 hover:text-gold text-sm transition-colors">← Back to keyinvestigations.in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function switchTab(tab) {
      ['login','signup','reset'].forEach(t => {
        document.getElementById('panel-' + t).classList.add('hidden');
        const tabEl = document.getElementById('tab-' + t);
        if (tabEl) tabEl.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-white/50 hover:text-white';
      });
      document.getElementById('panel-' + tab).classList.remove('hidden');
      const activeTab = document.getElementById('tab-' + tab);
      if (activeTab) activeTab.className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-white text-navy';
      hideAlert();
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert-box');
      el.textContent = msg;
      el.className = type === 'error'
        ? 'mb-5 px-4 py-3 rounded-xl text-sm font-medium bg-red-500/10 border border-red-500/20 text-red-400'
        : 'mb-5 px-4 py-3 rounded-xl text-sm font-medium bg-green-500/10 border border-green-500/20 text-green-400';
    }
    function hideAlert() { document.getElementById('alert-box').className = 'hidden mb-5 px-4 py-3 rounded-xl text-sm font-medium'; }

    const SUPABASE_URL = 'https://mqsohzqbsupsathxphgd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xc29oenFic3Vwc2F0aHhwaGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDc5ODIsImV4cCI6MjA5Mzg4Mzk4Mn0.uyXA4qRgDNRAWqG27gcZVO85T2SmxianHBb514t_6Xc';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ROLE_ROUTES = { key_admin:'admin.html', key_qc:'qc.html', key_agent:'agent.html', external:'dashboard.html' };

    async function routeByProfile(userId) {
      const { data: profile } = await supabase
        .from('profiles').select('system_role').eq('id', userId).single();
      window.location.href = ROLE_ROUTES[profile?.system_role] || 'dashboard.html';
    }

    // Redirect if already logged in
    supabase.auth.getSession().then(async ({ data: { session } }) => {
      if (session) await routeByProfile(session.user.id);
    });

    // Sign In — use user from response directly, no second getSession() call
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault(); hideAlert();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Signing in...'; btn.disabled = true;
      const { data, error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      });
      if (error) {
        showAlert(error.message); btn.textContent = 'Sign In'; btn.disabled = false;
      } else {
        await routeByProfile(data.user.id);
      }
    });

    // Sign Up
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault(); hideAlert();
      const btn = document.getElementById('signup-btn');
      btn.textContent = 'Creating account...'; btn.disabled = true;
      const { error } = await supabase.auth.signUp({
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value,
        options: { data: { full_name: document.getElementById('signup-name').value, company: document.getElementById('signup-company').value } }
      });
      if (error) { showAlert(error.message); btn.textContent = 'Create Account'; btn.disabled = false; }
      else showAlert('✓ Account created! Check your email to confirm your address.', 'success');
    });

    // Reset
    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault(); hideAlert();
      const { error } = await supabase.auth.resetPasswordForEmail(
        document.getElementById('reset-email').value,
        { redirectTo: 'https://keyinvestigations.in/dashboard.html' }
      );
      if (error) showAlert(error.message);
      else showAlert('✓ Reset link sent! Check your inbox.', 'success');
    });
  </script>
</body>
</html>
