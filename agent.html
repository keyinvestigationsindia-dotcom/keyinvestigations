<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agent Queue – KEY Investigations</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0a0f1e'},gold:{DEFAULT:'#c9a84c',light:'#e2c17a'}}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>html{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="header"></div>
<main class="max-w-7xl mx-auto px-6 py-8">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
    <div><h1 class="text-2xl font-bold text-navy">My Investigation Queue</h1>
      <p id="agentSub" class="text-slate-400 text-sm mt-0.5">Loading...</p></div>
    <div class="flex items-center gap-2 text-xs text-slate-400"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>Active</div>
  </div>
  <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
  <div class="flex flex-wrap gap-2 mb-5">
    <button onclick="applyF('all')" id="f-all" class="fx px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white">All</button>
    <button onclick="applyF('assigned')" id="f-assigned" class="fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">Assigned</button>
    <button onclick="applyF('in_progress')" id="f-in_progress" class="fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">In Progress</button>
    <button onclick="applyF('rfi_raised')" id="f-rfi_raised" class="fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">Revision Needed</button>
  </div>
  <div id="grid" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">
    <div class="col-span-full p-12 text-center text-slate-400 text-sm">Loading your queue...</div>
  </div>
</main>

<!-- CHECKLIST SUBMIT MODAL -->
<div id="updateModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-navy/70 backdrop-blur-sm">
  <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[92vh]">
    <div class="flex items-center justify-between px-6 py-5 border-b flex-shrink-0">
      <div>
        <h2 class="font-bold text-navy" id="updateTitle">Submit Checklist</h2>
        <p class="text-xs text-slate-400 mt-0.5" id="updateRound"></p>
      </div>
      <button onclick="closeUpdate()" class="text-slate-400 hover:text-navy text-lg">✕</button>
    </div>
    <div class="p-6 space-y-5 overflow-y-auto flex-1">
      <!-- Status -->
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Update Status</label>
        <select id="newStatus" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold">
          <option value="in_progress">In Progress – Still investigating</option>
          <option value="under_review">Submit for QC Review</option>
        </select>
      </div>
      <!-- Checklist items -->
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-3">Investigation Checklist</label>
        <div id="checklistItems" class="space-y-3"></div>
      </div>
      <!-- RFI Response -->
      <div id="rfiResponseSection" class="hidden bg-amber-50 border border-amber-100 rounded-xl p-4">
        <div class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2">Respond to QC Query</div>
        <div id="pendingRFI" class="text-sm text-amber-800 mb-3 font-medium"></div>
        <textarea id="rfiResponse" rows="2" placeholder="Your response..." class="w-full border border-amber-200 bg-white rounded-xl px-4 py-2.5 text-sm focus:outline-none resize-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t flex-shrink-0">
      <button onclick="submitUpdate()" class="w-full bg-gold text-navy font-bold py-3 rounded-xl hover:bg-gold-light transition-colors">Submit Checklist</button>
    </div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-navy/40" onclick="closeDrawer()"></div>
  <div class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-white shadow-2xl overflow-y-auto">
    <div class="sticky top-0 bg-white border-b px-6 py-5 flex items-center justify-between">
      <h2 class="font-bold text-navy" id="drawerTitle">Claim Details</h2>
      <button onclick="closeDrawer()" class="text-slate-400 hover:text-navy">✕</button>
    </div>
    <div id="drawerBody" class="p-6"></div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
let allClaims=[], updateClaimId=null, pendingRFIs=[], currentRound=1;

(async()=>{
  const session=await getSession(); if(!session) return window.location.href='login.html';
  const profile=await getProfile(session.user.id);
  if(!profile) return window.location.href='login.html';
  if(profile.system_role!=='key_agent') return window.location.href=ROLE_ROUTES[profile.system_role]||'login.html';
  document.getElementById('header').innerHTML=buildHeader(profile,'Agent Portal');
  const {data:agentData}=await sb.from('key_agents').select('*').eq('id',session.user.id).single();
  if(agentData){
    const states=(agentData.states||[]).join(', ')||'All states';
    const types=(agentData.claim_types||[]).join(', ')||'All types';
    document.getElementById('agentSub').textContent=`Coverage: ${states} · Specialization: ${types}`;
  }
  await loadQueue(session.user.id);
})();

async function loadQueue(uid){
  const {data}=await sb.from('claims')
    .select('*, claim_types(label), tenants(name)')
    .eq('agent_id',uid).order('created_at',{ascending:false});
  allClaims=data||[]; renderStats(); renderGrid(allClaims);
}

function renderStats(){
  const s={total:allClaims.length,assigned:0,in_progress:0,rfi:0};
  allClaims.forEach(c=>{if(c.status==='assigned')s.assigned++;if(c.status==='in_progress')s.in_progress++;if(c.status==='rfi_raised')s.rfi++;});
  document.getElementById('stats').innerHTML=[
    ['Total',s.total,'text-navy'],['Assigned',s.assigned,'text-blue-600'],
    ['In Progress',s.in_progress,'text-amber-500'],['Revision Needed',s.rfi,'text-red-500']
  ].map(([l,n,c])=>`<div class="bg-white border border-slate-200 rounded-xl p-4 text-center"><div class="text-2xl font-bold ${c}">${n}</div><div class="text-xs text-slate-400 mt-1 uppercase tracking-wider">${l}</div></div>`).join('');
}

function applyF(s){
  document.querySelectorAll('.fx').forEach(b=>b.className='fx px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600');
  document.getElementById('f-'+s).className='fx px-4 py-1.5 rounded-full text-xs font-semibold bg-navy text-white';
  renderGrid(s==='all'?allClaims:allClaims.filter(c=>c.status===s));
}

function renderGrid(claims){
  if(!claims.length){document.getElementById('grid').innerHTML='<div class="col-span-full p-16 text-center text-slate-400 text-sm">No cases in your queue</div>';return;}
  document.getElementById('grid').innerHTML=claims.map(c=>`
    <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col gap-4 hover:shadow-md">
      <div class="flex items-start justify-between">
        <div><div class="font-mono text-xs font-bold text-slate-400">${c.claim_number}</div>
          <div class="font-semibold text-navy mt-1 flex items-center gap-2">${TYPE_ICONS[c.claim_type_id]||'📋'} ${c.claim_types?.label||c.claim_type_id}</div></div>
        ${pill((c.priority||'normal').toUpperCase(),PRIORITY_PILL[c.priority]||'')}
      </div>
      <div class="text-xs text-slate-500 space-y-1">
        <div>🏢 ${c.tenants?.name||'–'}</div>
        <div>📍 ${c.location_city||'–'}, ${c.location_state||''}</div>
        <div>📅 ${formatDate(c.created_at)}</div>
      </div>
      ${c.status==='rfi_raised'?`<div class="bg-red-50 border border-red-100 rounded-lg p-2 text-xs text-red-600 font-semibold">⚠ QC requested revisions — please resubmit</div>`:''}
      ${c.status==='under_review'?`<div class="bg-purple-50 border border-purple-100 rounded-lg p-2 text-xs text-purple-600 font-semibold">⏳ Submitted — awaiting QC review</div>`:''}
      <div class="flex items-center justify-between pt-2 border-t border-slate-50">
        ${pill(STATUS_LABELS[c.status]||c.status,STATUS_COLORS[c.status]||'')}
        <div class="flex gap-2">
          <button onclick="openDrawer('${c.id}')" class="text-xs text-slate-400 hover:text-navy border border-slate-200 px-3 py-1.5 rounded-lg">Details</button>
          ${!['resolved','closed','under_review'].includes(c.status)?`<button onclick="openUpdate('${c.id}')" class="text-xs bg-gold/10 text-gold border border-gold/20 px-3 py-1.5 rounded-lg hover:bg-gold hover:text-navy font-semibold">Submit Checklist</button>`:''}
        </div>
      </div>
    </div>`).join('');
}

// ─── CHECKLIST MODAL ──────────────────────────────────────────
async function openUpdate(id){
  updateClaimId=id;
  const c=allClaims.find(x=>x.id===id);
  document.getElementById('updateTitle').textContent='Submit Checklist – '+c?.claim_number;
  document.getElementById('newStatus').value=c?.status==='assigned'?'in_progress':'under_review';

  // Load latest submission + its QC review in parallel
  const [{data:subs},{data:rfis}]=await Promise.all([
    sb.from('agent_checklist_submissions').select('*').eq('claim_id',id).order('round',{ascending:false}).limit(1),
    sb.from('rfis').select('*').eq('claim_id',id).eq('status','open').order('created_at',{ascending:false})
  ]);
  const latestSub=subs?.[0]||null;
  currentRound=(latestSub?.round||0)+1;

  let qcReview=null;
  if(latestSub){
    const {data:qcr}=await sb.from('qc_checklist_reviews')
      .select('*').eq('submission_id',latestSub.id).order('created_at',{ascending:false}).limit(1);
    qcReview=qcr?.[0]||null;
  }

  document.getElementById('updateRound').textContent=
    latestSub?`Round ${currentRound} resubmission · Previous: ${formatDate(latestSub.created_at)}`:'Round 1 – first submission';

  document.getElementById('checklistItems').innerHTML=CHECKLIST.map(item=>{
    const prev=latestSub?.items?.[item.key]||{};
    const qci=qcReview?.item_reviews?.[item.key]||{};
    const needsRevision=qci.verdict==='revision_needed';
    const approved=qci.verdict==='approved';
    const borderCls=needsRevision?'border-red-300 bg-red-50/40':approved?'border-green-300 bg-green-50/40':'border-slate-200';
    let badge='';
    if(needsRevision) badge=`<div class="mt-2 bg-red-50 border border-red-200 rounded-lg p-2.5"><p class="text-xs font-bold text-red-600 mb-1">⚠ QC: Revision Required</p><p class="text-xs text-red-700">${qci.remarks||'Please revise and resubmit.'}</p></div>`;
    else if(approved) badge=`<div class="mt-2 bg-green-50 border border-green-200 rounded-lg p-2 flex items-center gap-1.5"><span class="text-green-600 text-xs font-bold">✓ QC Approved</span></div>`;
    return `<div class="border ${borderCls} rounded-xl p-4">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" id="cl-${item.key}" ${prev.done?'checked':''} class="w-4 h-4 mt-0.5 rounded accent-gold flex-shrink-0"/>
        <div class="flex-1 min-w-0">
          <span class="text-sm font-medium text-navy">${item.label}</span>
          <textarea id="cl-notes-${item.key}" rows="2" placeholder="Notes, document references, observations…"
            class="mt-2 w-full border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-700 focus:outline-none focus:border-gold resize-none bg-white">${prev.notes||''}</textarea>
          ${badge}
        </div>
      </label>
    </div>`;
  }).join('');

  pendingRFIs=rfis||[];
  if(pendingRFIs.length){
    document.getElementById('rfiResponseSection').classList.remove('hidden');
    document.getElementById('pendingRFI').textContent='Q: '+pendingRFIs[0].question;
    document.getElementById('rfiResponse').value='';
  } else {
    document.getElementById('rfiResponseSection').classList.add('hidden');
  }
  document.getElementById('updateModal').classList.remove('hidden');
  document.getElementById('updateModal').classList.add('flex');
}
function closeUpdate(){document.getElementById('updateModal').classList.add('hidden');document.getElementById('updateModal').classList.remove('flex');}

async function submitUpdate(){
  if(!updateClaimId) return;
  const btn=document.querySelector('#updateModal button[onclick="submitUpdate()"]');
  btn.textContent='Submitting…'; btn.disabled=true;

  const status=document.getElementById('newStatus').value;
  const items={};
  CHECKLIST.forEach(item=>{
    items[item.key]={
      done:document.getElementById('cl-'+item.key)?.checked||false,
      notes:document.getElementById('cl-notes-'+item.key)?.value.trim()||''
    };
  });

  const session=await getSession();
  await sb.from('agent_checklist_submissions').insert({
    claim_id:updateClaimId, submitted_by:session.user.id, round:currentRound, items
  });
  await sb.from('claims').update({status}).eq('id',updateClaimId);

  if(pendingRFIs.length){
    const resp=document.getElementById('rfiResponse').value.trim();
    if(resp) await sb.from('rfis').update({response:resp,status:'responded'}).eq('id',pendingRFIs[0].id);
  }
  closeUpdate();
  await loadQueue(session.user.id);
}

// ─── DETAIL DRAWER ────────────────────────────────────────────
async function openDrawer(id){
  const c=allClaims.find(x=>x.id===id); if(!c) return;
  const fd=c.form_data||{};
  const [{data:rfis},{data:subs},{data:qcrs}]=await Promise.all([
    sb.from('rfis').select('*').eq('claim_id',id).order('created_at',{ascending:false}),
    sb.from('agent_checklist_submissions').select('*').eq('claim_id',id).order('round',{ascending:true}),
    sb.from('qc_checklist_reviews').select('*').eq('claim_id',id).order('round',{ascending:true})
  ]);
  document.getElementById('drawerTitle').textContent=c.claim_number;

  // Build checklist history HTML
  const historyHtml=(subs||[]).map(sub=>{
    const qcr=(qcrs||[]).find(r=>r.submission_id===sub.id);
    return `<div class="mb-4 border border-slate-200 rounded-xl overflow-hidden">
      <div class="bg-slate-50 px-4 py-2.5 flex items-center justify-between border-b">
        <span class="text-xs font-bold text-navy">Round ${sub.round}</span>
        <span class="text-xs text-slate-400">${formatDate(sub.created_at)}</span>
      </div>
      <div class="p-3 space-y-2">
        ${CHECKLIST.map(item=>{
          const si=sub.items?.[item.key]||{};
          const qi=qcr?.item_reviews?.[item.key]||{};
          const verdictBadge=qi.verdict==='approved'?`<span class="text-xs font-bold text-green-600">✓ QC Approved</span>`:qi.verdict==='revision_needed'?`<span class="text-xs font-bold text-red-600">↩ Revision: ${qi.remarks||''}</span>`:'';
          return `<div class="flex items-start gap-2 text-xs">
            <span class="${si.done?'text-green-500':'text-slate-300'} flex-shrink-0 mt-0.5">${si.done?'✓':'○'}</span>
            <div class="flex-1 min-w-0">
              <span class="${si.done?'text-slate-700':'text-slate-400'}">${item.label}</span>
              ${si.notes?`<p class="text-slate-400 mt-0.5 truncate">${si.notes}</p>`:''}
              ${verdictBadge?`<div class="mt-1">${verdictBadge}</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${qcr?`<div class="border-t bg-slate-50 px-4 py-2.5 text-xs">
        <span class="font-bold ${qcr.overall_verdict==='approved'?'text-green-600':'text-red-600'}">QC Overall: ${qcr.overall_verdict==='approved'?'✓ Approved':'↩ Revisions Required'}</span>
        ${qcr.overall_notes?`<p class="text-slate-500 mt-1">${qcr.overall_notes}</p>`:''}
      </div>`:'<div class="border-t bg-amber-50 px-4 py-2.5 text-xs text-amber-600 font-medium">⏳ Awaiting QC review</div>'}
    </div>`;
  }).join('');

  document.getElementById('drawerBody').innerHTML=`
    <div class="flex items-center gap-3 mb-5">
      <span class="text-3xl">${TYPE_ICONS[c.claim_type_id]||'📋'}</span>
      <div><div class="font-semibold text-navy">${c.claim_types?.label||c.claim_type_id}</div>
        <div class="text-xs text-slate-400">${c.tenants?.name} · ${formatDate(c.created_at)}</div></div>
      ${pill(STATUS_LABELS[c.status]||c.status,STATUS_COLORS[c.status]||'')}
    </div>
    <div class="grid grid-cols-2 gap-3 mb-5">
      ${Object.entries(fd).filter(([,v])=>v).map(([k,v])=>`<div class="bg-slate-50 rounded-xl p-3">
        <div class="text-xs text-slate-400 uppercase tracking-wider mb-1">${k.replace(/_/g,' ')}</div>
        <div class="text-sm font-medium text-navy">${v}</div></div>`).join('')}
    </div>
    ${historyHtml?`<div class="mb-5"><h3 class="font-semibold text-navy text-sm mb-3">📋 Checklist History</h3>${historyHtml}</div>`:''}
    ${rfis?.length?`<div class="mb-5"><h3 class="font-semibold text-navy text-sm mb-2">❓ RFIs</h3>
      ${rfis.map(r=>`<div class="border border-slate-200 rounded-xl p-3 mb-2">
        ${pill(r.status,r.status==='open'?'bg-red-50 text-red-600':r.status==='responded'?'bg-green-50 text-green-600':'bg-slate-100 text-slate-500')}
        <div class="text-sm font-medium text-navy mt-1 mb-1">${r.question}</div>
        ${r.response?`<div class="text-xs text-green-700 bg-green-50 rounded-lg p-2">✓ ${r.response}</div>`:''}
      </div>`).join('')}</div>`:''}
    ${!['resolved','closed','under_review'].includes(c.status)?`<button onclick="closeDrawer();openUpdate('${c.id}')" class="w-full bg-gold text-navy font-bold py-3 rounded-xl text-sm">Submit Checklist</button>`:''}`;
  document.getElementById('drawer').classList.remove('hidden');
}
function closeDrawer(){document.getElementById('drawer').classList.add('hidden');}
</script></body></html>
