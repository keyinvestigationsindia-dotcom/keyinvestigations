<script>
// Auth guard — allow key_admin, key_qc, key_agent
let currentProfile = null;
async function doAuth(){
  const session = await getSession();
  if(!session) return window.location.href='login.html';
  const profile = await getProfile(session.user.id);
  if(!profile) return window.location.href='login.html';
  const allowed = ['key_admin','key_qc','key_agent'];
  if(!allowed.includes(profile.system_role)) return window.location.href=ROLE_ROUTES[profile.system_role]||'login.html';
  currentProfile = profile;
  document.getElementById('header').innerHTML = buildHeader(profile, profile.system_role==='key_admin'?'Super Admin':'');
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-root').style.display='block';
}
doAuth();

// Catch Babel / React errors and show them
window.addEventListener('error', function(e){
  var d = document.getElementById('app-root');
  if(d) d.innerHTML = '<div style="padding:40px;color:red;font-size:14px;font-family:monospace;white-space:pre-wrap">Error: '+e.message+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</div>';
  document.getElementById('auth-loading').style.display='none';
  d.style.display='block';
});
window.addEventListener('unhandledrejection', function(e){
  var d = document.getElementById('app-root');
  if(d) d.innerHTML = '<div style="padding:40px;color:red;font-size:14px;font-family:monospace;white-space:pre-wrap">Promise Error: '+(e.reason&&e.reason.message||e.reason||'unknown')+'</div>';
  document.getElementById('auth-loading').style.display='none';
  d.style.display='block';
});
</script>

const initialDocCategories = () => {
  const obj = {};
  DOC_CATEGORIES.forEach((cat) => { obj[cat.key] = { include: false, values: {} }; });
  return obj;
};

// ── Draft Persistence (localStorage) ──
const DRAFTS_STORAGE_KEY = "ki_report_drafts";
const CURRENT_DRAFT_KEY = "ki_current_draft_id";
const genDraftId = () => typeof crypto.randomUUID === "function" ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

const getAllDrafts = () => { try { return JSON.parse(localStorage.getItem(DRAFTS_STORAGE_KEY) || "{}"); } catch { return {}; } };

const saveDraftToStorage = (id, data) => {
  const drafts = getAllDrafts();
  const existing = drafts[id] || {};
  drafts[id] = { ...data, id, updatedAt: new Date().toISOString(), createdAt: existing.createdAt || new Date().toISOString() };
  localStorage.setItem(DRAFTS_STORAGE_KEY, JSON.stringify(drafts));
  localStorage.setItem(CURRENT_DRAFT_KEY, id);
};

const deleteDraftFromStorage = (id) => {
  const drafts = getAllDrafts();
  delete drafts[id];
  localStorage.setItem(DRAFTS_STORAGE_KEY, JSON.stringify(drafts));
  if (localStorage.getItem(CURRENT_DRAFT_KEY) === id) localStorage.removeItem(CURRENT_DRAFT_KEY);
};

const buildDraftTitle = (caseData) => {
  const parts = [];
  if (caseData.claimNo) parts.push("#" + caseData.claimNo);
  if (caseData.claimType) parts.push(caseData.claimType);
  if (caseData.insured) parts.push(caseData.insured);
  return parts.length ? parts.join(" — ") : "Untitled draft";
};

const timeAgo = (iso) => {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
};

// ── Main Report Tool ──
function InvestigationReportTool() {
  const [caseData, setCaseData] = useState(initialCase);
  const [docCategories, setDocCategories] = useState(initialDocCategories());
  const [extraNotes, setExtraNotes] = useState("");
  const [generating, setGenerating] = useState(false);
  const [report, setReport] = useState(null);
  const [error, setError] = useState(null);
  const [openSections, setOpenSections] = useState({ case: true, docs: true });
  const [expandedDocs, setExpandedDocs] = useState({});
  const [showSettings, setShowSettings] = useState(false);

  const updateCase = (field, value) => setCaseData((c) => ({ ...c, [field]: value }));
  const toggleDocInclude = (catKey) => setDocCategories((d) => ({...d,[catKey]:{...d[catKey],include:!d[catKey].include}}));
  const updateDocField = (catKey, fieldKey, value) => setDocCategories((d) => ({...d,[catKey]:{...d[catKey],values:{...d[catKey].values,[fieldKey]:value}}}));
  const toggleExpanded = (catKey) => setExpandedDocs((e) => ({ ...e, [catKey]: !e[catKey] }));
  const toggleSection = (key) => setOpenSections((s) => ({ ...s, [key]: !s[key] }));

  const [autoFilling, setAutoFilling] = useState({});
  const [autoFillError, setAutoFillError] = useState({});
  const [autoUpdating, setAutoUpdating] = useState(false);
  const [userEditedReport, setUserEditedReport] = useState(false);
  const [queueStatus, setQueueStatus] = useState(null);
  const debounceRef = useRef(null);
  const lastSnapshotRef = useRef("");

  // ── Claims linking (state declared early so draft persistence can reference it) ──
  const [claimsList, setClaimsList] = useState(null);
  const [linkedClaim, setLinkedClaim] = useState(null);
  const [claimsLoading, setClaimsLoading] = useState(false);
  const [showClaimPicker, setShowClaimPicker] = useState(false);
  const [claimSearch, setClaimSearch] = useState("");

  // ── Draft persistence ──
  const [currentDraftId, setCurrentDraftId] = useState(() => localStorage.getItem(CURRENT_DRAFT_KEY) || genDraftId());
  const [lastSaved, setLastSaved] = useState(null);
  const [showDraftPicker, setShowDraftPicker] = useState(false);
  const draftSaveRef = useRef(null);
  const draftLoadedRef = useRef(false);

  useEffect(() => {
    if (draftLoadedRef.current) return;
    draftLoadedRef.current = true;
    const savedId = localStorage.getItem(CURRENT_DRAFT_KEY);
    if (!savedId) return;
    const drafts = getAllDrafts();
    const draft = drafts[savedId];
    if (!draft) return;
    setCaseData(c => ({ ...initialCase, ...draft.caseData }));
    setDocCategories(() => {
      const base = initialDocCategories();
      for (const [k, v] of Object.entries(draft.docCategories || {})) { if (base[k]) base[k] = v; }
      return base;
    });
    setExtraNotes(draft.extraNotes || "");
    if (draft.generatedReport) { setReport(draft.generatedReport); setUserEditedReport(true); }
    if (draft.linkedClaim) setLinkedClaim(draft.linkedClaim);
    setLastSaved(draft.updatedAt);
    setCurrentDraftId(savedId);
  }, []);

  const draftSnapshot = JSON.stringify({ caseData, docCategories, extraNotes, report, linkedClaim });
  useEffect(() => {
    if (!draftLoadedRef.current) return;
    if (draftSaveRef.current) clearTimeout(draftSaveRef.current);
    draftSaveRef.current = setTimeout(() => {
      saveDraftToStorage(currentDraftId, { title: buildDraftTitle(caseData), caseData, docCategories, extraNotes, generatedReport: report, linkedClaim });
      setLastSaved(new Date().toISOString());
    }, 1500);
    return () => clearTimeout(draftSaveRef.current);
  }, [draftSnapshot, currentDraftId]);

  const loadDraft = (id) => {
    const draft = getAllDrafts()[id];
    if (!draft) return;
    setCaseData({ ...initialCase, ...draft.caseData });
    const base = initialDocCategories();
    for (const [k, v] of Object.entries(draft.docCategories || {})) { if (base[k]) base[k] = v; }
    setDocCategories(base);
    setExtraNotes(draft.extraNotes || "");
    setReport(draft.generatedReport || null);
    setLinkedClaim(draft.linkedClaim || null);
    setCurrentDraftId(id);
    setLastSaved(draft.updatedAt);
    setUserEditedReport(!!draft.generatedReport);
    setShowDraftPicker(false);
    setDiagram(null);
    localStorage.setItem(CURRENT_DRAFT_KEY, id);
  };

  const newDraft = () => {
    const id = genDraftId();
    setCaseData({...initialCase});
    setDocCategories(initialDocCategories());
    setExtraNotes("");
    setReport(null);
    setDiagram(null);
    setError(null);
    setLinkedClaim(null);
    setCurrentDraftId(id);
    setLastSaved(null);
    setUserEditedReport(false);
    setShowDraftPicker(false);
    setExpandedDocs({});
    localStorage.setItem(CURRENT_DRAFT_KEY, id);
  };

  const deleteDraft = (id) => {
    deleteDraftFromStorage(id);
    if (id === currentDraftId) newDraft();
  };

  // ── Claims linking (functions) ──
  const fetchClaims = async () => {
    if (claimsList) { setShowClaimPicker(true); return; }
    setClaimsLoading(true);
    try {
      const { data, error } = await sb.from("claims").select("id, claim_number, claim_type_id, status, form_data, created_at").order("created_at", { ascending: false }).limit(100);
      if (error) throw error;
      setClaimsList(data || []);
      setShowClaimPicker(true);
    } catch (e) { console.error("Failed to fetch claims:", e); setClaimsList([]); setShowClaimPicker(true); }
    finally { setClaimsLoading(false); }
  };

  const linkClaim = (claim) => {
    setLinkedClaim(claim);
    setShowClaimPicker(false);
    const fd = claim.form_data || {};
    const typeMap = { mact: "MACT Death Claim", motor_od: "TPPD Claim", tp: "TPPD Claim" };
    setCaseData(c => ({
      ...c,
      claimNo: claim.claim_number || c.claimNo,
      claimType: typeMap[claim.claim_type_id] || c.claimType,
      policyNo: fd.policy_number || c.policyNo,
      doa: fd.accident_date || fd.incident_date || fd.theft_date || c.doa,
      ivVehicle: fd.vehicle_numbers || fd.insured_vehicle || fd.vehicle_reg || c.ivVehicle,
      court: fd.court_name || c.court,
      claimAmount: fd.claim_amount ? "₹" + Number(fd.claim_amount).toLocaleString("en-IN") : c.claimAmount,
      insured: fd.claimant_name || fd.patient_name || fd.tp_name || c.insured,
    }));
  };

  const unlinkClaim = () => { setLinkedClaim(null); };

  const filteredClaims = (claimsList || []).filter(c => {
    if (!claimSearch) return true;
    const s = claimSearch.toLowerCase();
    const fd = c.form_data || {};
    return (c.claim_number || "").toLowerCase().includes(s)
      || (c.claim_type_id || "").toLowerCase().includes(s)
      || (fd.claimant_name || "").toLowerCase().includes(s)
      || (fd.policy_number || "").toLowerCase().includes(s)
      || (fd.vehicle_numbers || fd.insured_vehicle || "").toLowerCase().includes(s);
  });

  const aiQueueRef = useRef(Promise.resolve());
  const runQueued = (fn) => {
    const run = async () => { try { return await fn(); } finally { setQueueStatus(null); } };
    const queued = aiQueueRef.current.then(run, run);
    aiQueueRef.current = queued.catch(() => {});
    return queued;
  };

  const fetchBimaAI = async (endpoint, body, { maxRetries = 4 } = {}) => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; throw new Error("Session expired"); }
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      const response = await fetch(BIMA_AI_URL + endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token,
        },
        body: JSON.stringify(body),
      });
      if (response.status === 401) {
        window.location.href = 'login.html';
        throw new Error("Session expired — please log in again.");
      }
      if ((response.status === 429 || response.status === 529 || response.status === 503) && attempt < maxRetries) {
        const wait = Math.min(2000 * Math.pow(2, attempt), 16000);
        setQueueStatus(`Server busy, retrying in ${Math.round(wait / 1000)}s… (${attempt + 1}/${maxRetries})`);
        await new Promise((r) => setTimeout(r, wait));
        continue;
      }
      return response;
    }
  };

  const describeFailedResponse = async (response) => {
    const errBody = await response.text().catch(() => "");
    if (/^\s*<!doctype html/i.test(errBody) || /^\s*<html/i.test(errBody))
      return `Request failed (${response.status}) — upload may be too large. Try fewer pages/files.`;
    return `API error ${response.status}: ${errBody.slice(0, 200) || "no details"}`;
  };

  const mergeFieldValues = (oldValues, newValues) => {
    const merged = { ...oldValues };
    for (const [key, rawNewVal] of Object.entries(newValues || {})) {
      const newVal = (rawNewVal || "").toString().trim();
      const oldVal = (oldValues?.[key] || "").toString().trim();
      if (!newVal) continue;
      if (!oldVal) { merged[key] = newVal; }
      else if (oldVal === newVal || oldVal.includes(newVal)) { merged[key] = oldVal; }
      else { merged[key] = `${oldVal}\n\n${newVal}`; }
    }
    return merged;
  };

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const pdfjsRef = useRef(null);
  const loadPdfJs = async () => {
    if (pdfjsRef.current) return pdfjsRef.current;
    if (!window.pdfjsLib) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Could not load PDF reader library"));
        document.head.appendChild(script);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    pdfjsRef.current = window.pdfjsLib;
    return window.pdfjsLib;
  };

  const pdfFileToImages = async (file) => {
    const pdfjsLib = await loadPdfJs();
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const images = [];
    const maxPages = Math.min(pdf.numPages, 20);
    for (let i = 1; i <= maxPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.3 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      images.push({ mediaType: "image/jpeg", data: dataUrl.split(",")[1] });
    }
    return images;
  };

  const mammothRef = useRef(null);
  const loadMammoth = async () => {
    if (mammothRef.current) return mammothRef.current;
    if (!window.mammoth) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Could not load Word document reader library"));
        document.head.appendChild(script);
      });
    }
    mammothRef.current = window.mammoth;
    return window.mammoth;
  };

  const docxFileToText = async (file) => {
    const mammoth = await loadMammoth();
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value || "";
  };

  const fileToOptimizedBase64 = async (file) => {
    const MAX_DIMENSION = 1300;
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = reject;
      el.src = dataUrl;
    });
    let { width, height } = img;
    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
      const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
      width = Math.round(width * ratio); height = Math.round(height * ratio);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, width, height);
    const resizedDataUrl = canvas.toDataURL("image/jpeg", 0.72);
    return { mediaType: "image/jpeg", data: resizedDataUrl.split(",")[1] };
  };

  const handleAutoFill = async (cat, files) => {
    if (!files || files.length === 0) return;
    setAutoFilling((s) => ({ ...s, [cat.key]: true }));
    setAutoFillError((s) => ({ ...s, [cat.key]: null }));
    try {
      const imagesPayload = []; const docxTexts = [];
      for (const file of Array.from(files)) {
        const isDocx = file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document" || file.name.toLowerCase().endsWith(".docx");
        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
          const pdfImages = await pdfFileToImages(file); imagesPayload.push(...pdfImages);
        } else if (isDocx) {
          const text = await docxFileToText(file);
          if (text.trim()) docxTexts.push(`--- ${file.name} ---\n${text.trim()}`);
        } else if (file.type.startsWith("image/")) {
          const optimized = await fileToOptimizedBase64(file); imagesPayload.push(optimized);
        } else { throw new Error(`"${file.name}" isn't supported. Upload JPG/PNG/PDF/DOCX.`); }
      }
      if (imagesPayload.length > 20) throw new Error("Upload at most 20 pages/files at a time.");
      const approxTotalKB = imagesPayload.reduce((sum, img) => sum + img.data.length * 0.75, 0) / 1024;
      if (approxTotalKB > 18000) throw new Error(`Files too large (~${Math.round(approxTotalKB / 1024)}MB). Try fewer pages.`);

      const fieldList = cat.fields.map((f) => `"${f.key}": "${f.label}"`).join(", ");
      const docxTextBlock = docxTexts.length ? `\n\nADDITIONAL TEXT FROM UPLOADED WORD DOCUMENT(S):\n${docxTexts.join("\n\n")}` : "";
      const analysisHintBlock = cat.analysisHint ? `\n\nSPECIAL INSTRUCTIONS FOR THIS CATEGORY:\n${cat.analysisHint}` : "";

      const promptText = `You are reading scanned insurance investigation document page(s) and/or Word document text (FIR / panchnama / postmortem / statement / vehicle document etc.) for the category "${cat.title}". Multiple images may represent multiple pages of the same document, or multiple separate documents of the same category — read all of them together as one source, along with any Word document text provided below. The text may be in any major Indian language — Hindi, Gujarati, Marathi, Tamil, Telugu, Kannada, Malayalam, Bengali, Punjabi, Odia, Assamese, Urdu — or English, or a mix of these.

Read the image(s) and text carefully, identify the language(s) used, and extract the following fields, translating everything into English:
{ ${fieldList} }
${analysisHintBlock}

Rules:
- Return ONLY a JSON object with exactly these keys, nothing else (no markdown fences, no preamble).
- For each field, put the relevant extracted/translated information as a string.
- If a field's information is not visible or not present anywhere, set it to an empty string "" — do NOT guess.
- For narrative/long text fields, summarize in formal English, faithful to the source.
- If images are unreadable or blank and no text is provided, return all fields as empty strings.${docxTextBlock}`;

      const response = await runQueued(() => fetchBimaAI("/ki/vision", {
        images: imagesPayload, prompt: promptText, max_tokens: 6144, model_tier: "fast",
      }));
      if (!response.ok) throw new Error(await describeFailedResponse(response));
      const data = await response.json();
      if (!data.content) throw new Error("Unexpected response from AI service.");
      if (data.stop_reason === "max_tokens") throw new Error("Content too long — try uploading fewer pages at once.");
      const text = data.content;
      const cleaned = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);

      setDocCategories((d) => ({...d,[cat.key]:{include:true,values:mergeFieldValues(d[cat.key].values,parsed)}}));
      setExpandedDocs((e) => ({ ...e, [cat.key]: true }));
    } catch (e) {
      setAutoFillError((s) => ({ ...s, [cat.key]: e.message || "Could not read document." }));
    } finally { setAutoFilling((s) => ({ ...s, [cat.key]: false })); }
  };

  const [headerAutoFilling, setHeaderAutoFilling] = useState(false);
  const [headerAutoFillError, setHeaderAutoFillError] = useState(null);

  const handleHeaderAutoFill = async (files) => {
    if (!files || files.length === 0) return;
    setHeaderAutoFilling(true); setHeaderAutoFillError(null);
    try {
      const imagesPayload = []; const docxTexts = [];
      for (const file of Array.from(files)) {
        const isDocx = file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document" || file.name.toLowerCase().endsWith(".docx");
        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
          imagesPayload.push(...(await pdfFileToImages(file)));
        } else if (isDocx) {
          const text = await docxFileToText(file);
          if (text.trim()) docxTexts.push(`--- ${file.name} ---\n${text.trim()}`);
        } else if (file.type.startsWith("image/")) {
          imagesPayload.push(await fileToOptimizedBase64(file));
        } else { throw new Error(`"${file.name}" isn't supported.`); }
      }
      if (imagesPayload.length > 20) throw new Error("Upload at most 20 pages at a time.");
      const docxTextBlock = docxTexts.length ? `\n\nADDITIONAL TEXT FROM UPLOADED WORD DOCUMENT(S):\n${docxTexts.join("\n\n")}` : "";

      const promptText = `You are reading insurance claim document(s) — could be a claim intimation letter, policy copy, RC, petition, or FIR — possibly in any major Indian language or English. Extract the following case-level fields, translating into English:
{
  "claimType": "one of exactly: 'MACT Death Claim', 'MACT Injury Claim', 'TPPD Claim'. Empty string if unclear.",
  "claimNo": "MACT/claim number",
  "court": "court / jurisdiction",
  "claimAmount": "claim amount as stated",
  "doa": "date of accident",
  "ivVehicle": "insured vehicle type, number and registration",
  "insured": "name of the insured",
  "policyNo": "policy number",
  "policyPeriod": "policy period (from-to dates)"
}
Rules:
- Return ONLY this JSON object.
- If a field isn't visible, set it to "" — do NOT guess.

              {showClaimPicker && (
                <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:50,background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,boxShadow:"0 8px 24px rgba(0,0,0,.12)",maxHeight:320,display:"flex",flexDirection:"column"}}>
                  <div style={{padding:"8px 10px",borderBottom:"1px solid #E3DDD0",display:"flex",alignItems:"center",gap:8}}>
                    <Icon.Search size={13} color="#A6A595" />
                    <input value={claimSearch} onChange={e=>setClaimSearch(e.target.value)} placeholder="Search by claim no., name, policy, vehicle…" autoFocus style={{flex:1,border:"none",outline:"none",fontSize:12,fontFamily:"Inter",background:"transparent"}} />
                    <button onClick={()=>{setShowClaimPicker(false);setClaimSearch("");}} style={{background:"none",border:"none",cursor:"pointer",padding:2}}><Icon.X size={14} color="#A6A595" /></button>
                  </div>
                  <div style={{overflowY:"auto",flex:1}}>
                    {filteredClaims.length === 0 && <div style={{padding:"16px",textAlign:"center",fontSize:12,color:"#A6A595"}}>No claims found</div>}
                    {filteredClaims.map(c => {
                      const fd = c.form_data || {};
                      const name = fd.claimant_name || fd.patient_name || fd.tp_name || "";
                      return (
                        <div key={c.id} onClick={()=>linkClaim(c)} style={{padding:"10px 12px",cursor:"pointer",borderBottom:"1px solid #F0ECE4",display:"flex",alignItems:"center",gap:10,transition:"background .1s"}} onMouseEnter={e=>e.currentTarget.style.background="#F8F6F0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:12,fontWeight:600,color:"#1B2A4A"}}>{c.claim_number} <span style={{fontWeight:400,color:"#857F6E",textTransform:"uppercase",fontSize:10}}>{c.claim_type_id}</span></div>
                            {name && <div style={{fontSize:11,color:"#857F6E",marginTop:2}}>{name}{fd.policy_number ? ` · ${fd.policy_number}` : ""}</div>}
                          </div>
                          <span style={{fontSize:10,color:"#A6A595"}}>{new Date(c.created_at).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"})}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
          {openSections.case && (
            <div style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,padding:16,marginBottom:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <SelectField label="Claim type" value={caseData.claimType} onChange={(v)=>updateCase("claimType",v)} options={["MACT Death Claim","MACT Injury Claim","TPPD Claim"]} />
              <Field label="Claim no." value={caseData.claimNo} onChange={(v)=>updateCase("claimNo",v)} />
              <Field label="Court / jurisdiction" value={caseData.court} onChange={(v)=>updateCase("court",v)} />
              <Field label="Claim amount" value={caseData.claimAmount} onChange={(v)=>updateCase("claimAmount",v)} />
              <Field label="Date of accident" value={caseData.doa} onChange={(v)=>updateCase("doa",v)} />
              <Field label="Insured vehicle no." value={caseData.ivVehicle} onChange={(v)=>updateCase("ivVehicle",v)} />
              <Field label="Insured" value={caseData.insured} onChange={(v)=>updateCase("insured",v)} />
              <Field label="Policy no. & period" value={caseData.policyNo} onChange={(v)=>updateCase("policyNo",v)} />
            </div>
          )}

          <SectionHeader title="Source documents & statements" open={openSections.docs} onToggle={()=>toggleSection("docs")} />
          {openSections.docs && (
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11.5,color:"#857F6E",marginBottom:10,lineHeight:1.5}}>
                Tick a document and either fill manually or use "Upload to auto-fill" with JPG/PNG/PDF/Word files — up to 20 pages per upload. Supports Hindi, Gujarati, Marathi, Tamil, Telugu, Kannada, Malayalam, Bengali, Punjabi, Odia, Assamese, Urdu and English.
              </div>
              {DOC_CATEGORIES.map((cat) => {
                const state = docCategories[cat.key];
                const isOpen = !!expandedDocs[cat.key];
                return (
                  <div key={cat.key} style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,marginBottom:8,overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer"}} onClick={()=>toggleExpanded(cat.key)}>
                      <input type="checkbox" checked={state.include} onChange={(e)=>{e.stopPropagation();toggleDocInclude(cat.key);if(!state.include)setExpandedDocs((ex)=>({...ex,[cat.key]:true}));}} onClick={(e)=>e.stopPropagation()} style={{width:15,height:15,accentColor:"#1B2A4A"}} />
                      <span style={{fontFamily:"Inter",fontWeight:600,fontSize:13,color:state.include?"#1B2A4A":"#A6A595",flex:1}}>{cat.title}</span>
                      <label className="ir-btn-ghost" style={{cursor:"pointer",fontSize:11,padding:"5px 9px"}} onClick={(e)=>e.stopPropagation()}>
                        {autoFilling[cat.key] ? <Icon.Loader2 size={12} /> : <Icon.Upload size={12} />}
                        {autoFilling[cat.key] ? "Reading…" : "Upload to auto-fill"}
                        <input type="file" accept="image/*,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple style={{display:"none"}} disabled={autoFilling[cat.key]} onChange={(e)=>handleAutoFill(cat,e.target.files)} />
                      </label>
                      {isOpen ? <Icon.ChevronDown size={14} color="#A6A595" /> : <Icon.ChevronRight size={14} color="#A6A595" />}
                    </div>
                    {autoFillError[cat.key] && <div style={{margin:"0 14px 10px",padding:"8px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:11.5,color:"#A8362B",lineHeight:1.5}}>{autoFillError[cat.key]}</div>}
                    {isOpen && (
                      <div style={{padding:"4px 14px 14px",display:"grid",gap:10}}>
                        {cat.fields.map((f) => {
                          const hasValue = !!(state.values[f.key] || "").trim();
                          return (
                            <div key={f.key}>
                              <span className="ir-label" style={{display:"flex",alignItems:"center",gap:5}}>
                                {f.label}
                                {hasValue && <Icon.Sparkles size={11} color="#B8762E" style={{display:"inline",verticalAlign:"middle"}} />}
                              </span>
                              {f.options ? (
                                <select className="ir-input" style={{cursor:"pointer"}} value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)}>
                                  <option value="">— Select —</option>
                                  {f.options.map((opt)=><option key={opt} value={opt}>{opt}</option>)}
                                </select>
                              ) : f.area ? (
                                <textarea className="ir-textarea" value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)} />
                              ) : (
                                <input className="ir-input" value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)} />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <div className="ir-label">Investigator field notes (optional)</div>
          <textarea className="ir-textarea" style={{minHeight:90,marginBottom:18}} placeholder="Anything from your own field visits not captured above…" value={extraNotes} onChange={(e)=>setExtraNotes(e.target.value)} />

          <button className="ir-btn-primary" onClick={()=>generateReport()} disabled={generating} style={{width:"100%",justifyContent:"center"}}>
            {generating ? <Icon.Loader2 size={16} /> : <Icon.FileText size={16} />}
            {generating ? "Drafting report…" : report ? "Regenerate full report" : "Generate report draft"}
          </button>
          <div style={{fontSize:11,color:"#A6A595",marginTop:6}}>
            Report auto-updates ~2s after changes unless you've edited the draft manually.
          </div>
          {error && <div style={{marginTop:12,padding:10,background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:12.5,color:"#A8362B"}}>{error}</div>}
        </div>

        {/* RIGHT: REPORT PREVIEW */}
        <div style={{background:"#FAF8F4",minHeight:"calc(100vh - 120px)",borderLeft:"1px solid #E3DDD0",padding:"24px 28px"}}>
          <div style={{maxWidth:640,margin:"0 auto"}}>
            {!report && !generating && (
              <div style={{textAlign:"center",padding:"80px 20px",color:"#A6A595"}}>
                <Icon.FileText size={32} style={{marginBottom:10,opacity:0.5}} />
                <div style={{fontFamily:"Lora",fontSize:14.5}}>Fill in a document on the left and the draft report will appear here automatically.</div>
              </div>
            )}
            {generating && (
              <div style={{textAlign:"center",padding:"80px 20px",color:"#5A5546"}}>
                <Icon.Loader2 size={26} style={{marginBottom:10}} />
                <div style={{fontFamily:"Lora",fontSize:14}}>Synthesizing statements and drafting sections…</div>
              </div>
            )}
            {report && (
              <div style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,padding:"28px 30px",fontFamily:"Lora"}}>
                <div style={{borderBottom:"2px solid #1B2A4A",paddingBottom:12,marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:11,fontFamily:"Inter",fontWeight:700,letterSpacing:"0.06em",color:"#1B2A4A",textTransform:"uppercase"}}>Investigation Report — Draft</div>
                    <div style={{fontSize:12,color:"#857F6E",marginTop:2,fontFamily:"Inter"}}>{caseData.claimType||"Claim type not set"} {caseData.claimNo && `· #${caseData.claimNo}`}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                    {autoUpdating && <div style={{fontSize:10.5,fontFamily:"Inter",color:"#B8762E",display:"flex",alignItems:"center",gap:5}}><Icon.Loader2 size={11} /> Updating…</div>}
                    <div style={{display:"flex",gap:6}}>
                      <button className="ir-btn-ghost" onClick={downloadAsWord}><Icon.FileText size={12} /> Word</button>
                      <button className="ir-btn-ghost" onClick={downloadAsText}><Icon.FileText size={12} /> Text</button>
                    </div>
                  </div>
                </div>

                {DOC_CATEGORIES.filter((cat) => docCategories[cat.key]?.include && report.sections?.[cat.key]).length > 0 && (
                  <div style={{marginBottom:4}}>
                    <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:10}}>Document-wise Briefs</div>
                    {DOC_CATEGORIES.filter((cat) => docCategories[cat.key]?.include && report.sections?.[cat.key]).map((cat) => (
                      <EditableSection key={cat.key} title={cat.title} text={report.sections[cat.key]} onChange={(v)=>updateReportSection(cat.key,v)} />
                    ))}
                  </div>
                )}

                {(diagram || diagramLoading || diagramError) && <AccidentDiagram diagram={diagram} loading={diagramLoading} error={diagramError} />}
                <div style={{marginBottom:18}}>
                  <button className="ir-btn-ghost" onClick={generateDiagram} disabled={diagramLoading}>
                    {diagramLoading ? <Icon.Loader2 size={13} /> : <Icon.Sparkles size={13} />}
                    {diagram ? "Regenerate accident schematic" : "Generate accident schematic"}
                  </button>
                </div>

                {report.redFlags?.length > 0 && (
                  <div style={{marginBottom:20,paddingTop:4,borderTop:"1px solid #E3DDD0"}}>
                    <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:8,marginTop:14,display:"flex",alignItems:"center",gap:6}}>
                      <Icon.AlertTriangle size={13} color="#A8362B" /> Red Flags ({report.redFlags.length})
                    </div>
                    {report.redFlags.map((rf, i) => (
                      <div key={i} style={{borderLeft:`3px solid ${severityColor(rf.severity)}`,paddingLeft:10,marginBottom:8}}>
                        <div style={{fontFamily:"Inter",fontSize:12.5,fontWeight:600,color:"#1B2A4A"}}>
                          {rf.flag} <span style={{fontSize:10,fontWeight:700,color:severityColor(rf.severity),textTransform:"uppercase",marginLeft:4}}>{rf.severity}</span>
                        </div>
                        <div style={{fontSize:13,color:"#3A3528",lineHeight:1.5}}>{rf.detail}</div>
                      </div>
                    ))}
                  </div>
                )}
                {report.redFlags?.length === 0 && (
                  <div style={{marginBottom:20,paddingTop:14,borderTop:"1px solid #E3DDD0",fontSize:12.5,fontFamily:"Inter",color:"#5A8266"}}>
                    No discrepancies flagged from the provided documents.
                  </div>
                )}

                <div style={{paddingTop:4,borderTop:"2px solid #1B2A4A",marginTop:6}}>
                  <div style={{fontFamily:"Inter",fontSize:10,fontWeight:700,letterSpacing:"0.06em",color:"#857F6E",textTransform:"uppercase",marginTop:14,marginBottom:14}}>Synthesis — all documents combined</div>
                  <EditableSection title="Findings" text={report.findings} onChange={(v)=>updateReportField("findings",v)} />
                  <EditableSection title="Observations" text={report.observations} onChange={(v)=>updateReportField("observations",v)} />
                  <EditableSection title="Conclusion" text={report.conclusion} onChange={(v)=>updateReportField("conclusion",v)} />
                </div>
                <div style={{fontSize:10.5,fontFamily:"Inter",color:"#A6A595",marginTop:24,paddingTop:12,borderTop:"1px solid #E3DDD0",lineHeight:1.5}}>
                  AI-generated draft — editable above. Verify all translated content and conclusions against source documents before issuing.
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ title, open, onToggle }) {
  return (
    <button onClick={onToggle} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",cursor:"pointer",padding:"4px 0",marginBottom:10,width:"100%"}}>
      {open ? <Icon.ChevronDown size={15} color="#1B2A4A" /> : <Icon.ChevronRight size={15} color="#1B2A4A" />}
      <span style={{fontFamily:"Inter",fontWeight:700,fontSize:13,color:"#1B2A4A",letterSpacing:"0.01em"}}>{title}</span>
    </button>
  );
}

function Field({ label, value, onChange }) {
  return (<div><span className="ir-label">{label}</span><input className="ir-input" value={value} onChange={(e)=>onChange(e.target.value)} /></div>);
}

function SelectField({ label, value, onChange, options }) {
  return (<div><span className="ir-label">{label}</span><select className="ir-input" value={value} onChange={(e)=>onChange(e.target.value)} style={{cursor:"pointer"}}>{options.map((opt)=><option key={opt} value={opt}>{opt}</option>)}</select></div>);
}

function EditableSection({ title, text, onChange }) {
  const [focused, setFocused] = useState(false);
  if (!text && !focused) return null;
  return (
    <div style={{marginBottom:18}}>
      <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:6}}>{title}</div>
      <textarea value={text||""} onChange={(e)=>onChange(e.target.value)} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        style={{width:"100%",fontFamily:"Lora",fontSize:14,lineHeight:1.65,color:"#2A2618",border:focused?"1px solid #1B2A4A":"1px solid transparent",borderRadius:4,padding:"4px 6px",margin:"-4px -6px",resize:"vertical",minHeight:60,background:focused?"#FAF8F4":"transparent"}}
      />
    </div>
  );
}

function AccidentDiagram({ diagram, loading, error }) {
  if (loading) return <div style={{marginBottom:18,textAlign:"center",padding:"30px 0",color:"#5A5546",fontFamily:"Inter",fontSize:12.5,background:"#F4F1EA",border:"1px solid #E3DDD0",borderRadius:6}}><Icon.Loader2 size={18} style={{marginBottom:6}} /><div>Building schematic…</div></div>;
  if (error) return <div style={{marginBottom:18,padding:12,background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:6,fontSize:12.5,fontFamily:"Inter",color:"#A8362B"}}>{error}</div>;
  if (!diagram) return null;
  const W = 560, H = 220;
  const roadStart = 40, roadEnd = W - 40;
  const posToX = (p) => roadStart + (Math.min(100, Math.max(0, p)) / 100) * (roadEnd - roadStart);
  const laneY = { near: H / 2 + 28, far: H / 2 - 28 };
  const arrowFor = (dir) => dir === "left" ? "←" : dir === "right" ? "→" : dir === "up" ? "↑" : "↓";
  return (
    <div style={{marginBottom:18}}>
      <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:6}}>
        Accident Schematic {diagram.confidence === "low" && <span style={{color:"#B8762E",fontWeight:600,fontSize:10}}>(LOW CONFIDENCE)</span>}
      </div>
      <div style={{background:"#F4F1EA",border:"1px solid #E3DDD0",borderRadius:6,padding:12}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
          <rect x={roadStart} y={H/2-45} width={roadEnd-roadStart} height={90} fill="#DCD6C7" />
          <line x1={roadStart} y1={H/2} x2={roadEnd} y2={H/2} stroke="#fff" strokeWidth="2" strokeDasharray="10,8" />
          <text x={W/2} y={H/2-55} textAnchor="middle" fontFamily="Inter" fontSize="11" fontWeight="600" fill="#5A5546">{diagram.roadDescription||"Road"}</text>
          {diagram.impactPoint != null && (<g><circle cx={posToX(diagram.impactPoint)} cy={H/2} r="6" fill="#A8362B" opacity="0.85" /><text x={posToX(diagram.impactPoint)} y={H/2+50} textAnchor="middle" fontFamily="Inter" fontSize="10" fontWeight="700" fill="#A8362B">IMPACT</text></g>)}
          {(diagram.vehicles||[]).map((v, i) => {
            const x = posToX(v.position ?? 50);
            const y = laneY[v.lane] || H / 2;
            const fill = v.role === "striking" ? "#1B2A4A" : v.role === "struck" ? "#A8362B" : "#5A5546";
            return (<g key={i}><rect x={x-32} y={y-12} width="64" height="24" rx="4" fill={fill} /><text x={x} y={y+4} textAnchor="middle" fontFamily="Inter" fontSize="13" fontWeight="700" fill="#fff">{arrowFor(v.direction)}</text><text x={x} y={y+26} textAnchor="middle" fontFamily="Inter" fontSize="9.5" fill="#2A2618">{v.label}</text></g>);
          })}
        </svg>
        {diagram.notes && <div style={{fontFamily:"Lora",fontSize:12.5,fontStyle:"italic",color:"#5A5546",marginTop:6,textAlign:"center"}}>{diagram.notes}</div>}
      </div>
      <div style={{fontSize:10.5,fontFamily:"Inter",color:"#A6A595",marginTop:6}}>Schematic from FIR/panchnama text — not a substitute for official spot panchnama.</div>
    </div>
  );
}

// ── App Wrapper ──
function App() {
  return <InvestigationReportTool />;
}

// Mount React
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App />);
</script>

<script>
// Manually transpile JSX and run — avoids cross-origin "Script error." from Babel standalone
try {
  var jsxCode = document.getElementById('jsx-source').textContent;
  var result = Babel.transform(jsxCode, { presets: [['env', { modules: false }], ['react', { runtime: 'classic' }]] });
  new Function(result.code)();
} catch(e) {
  var d = document.getElementById('app-root');
  if(d) d.innerHTML = '<div style="padding:40px;color:red;font-size:14px;font-family:monospace;white-space:pre-wrap">Babel Error:\n' + e.message + '\n\n' + (e.stack||'') + '</div>';
  document.getElementById('auth-loading').style.display='none';
  d.style.display='block';
}
</script>
</body></html>
