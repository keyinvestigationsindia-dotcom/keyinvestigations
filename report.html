<script>
// Auth guard — allow key_admin, key_qc, key_agent
let currentProfile = null;
async function doAuth(){
  const session = await getSession();
  if(!session) return window.location.href='login.html';
  const profile = await getProfile(session.user.id);
  if(!profile) return window.location.href='login.html';
  const allowed = ['key_admin','key_qc','key_agent'];
  if(!allowed.includes(profile.system_role)) return window.location.href=ROLE_ROUTES[profile.system_role]||'login.html';
  currentProfile = profile;
  document.getElementById('header').innerHTML = buildHeader(profile, profile.system_role==='key_admin'?'Super Admin':'');
  document.getElementById('auth-loading').style.display='none';
  document.getElementById('app-root').style.display='block';
}
doAuth();

// Catch Babel / React errors and show them
window.addEventListener('error', function(e){
  var d = document.getElementById('app-root');
  if(d) d.innerHTML = '<div style="padding:40px;color:red;font-size:14px;font-family:monospace;white-space:pre-wrap">Error: '+e.message+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</div>';
  document.getElementById('auth-loading').style.display='none';
  d.style.display='block';
});
window.addEventListener('unhandledrejection', function(e){
  var d = document.getElementById('app-root');
  if(d) d.innerHTML = '<div style="padding:40px;color:red;font-size:14px;font-family:monospace;white-space:pre-wrap">Promise Error: '+(e.reason&&e.reason.message||e.reason||'unknown')+'</div>';
  document.getElementById('auth-loading').style.display='none';
  d.style.display='block';
});
</script>

// Display-only filter for "Health Claim" — most of DOC_CATEGORIES (FIR,
// Panchnama, chargesheet, vehicle RC/permit/fitness etc.) is MACT/TP
// investigation content, irrelevant to a health-insurance treatment claim.
// This narrows what's SHOWN for Health Claim to what's already genuinely
// relevant; it does not touch docCategories state, buildDocsText, or any
// export — those still key off each category's own `include` flag, so no
// data already entered is ever hidden or lost, only the upload list itself.
// A real Health-specific taxonomy (Admission Record, Prescription,
// Medicine Chart, Lab Report, etc. as their own categories, plus a
// Medical Event/Patient Treatment Timeline) is separate, larger,
// deliberately-deferred work — see docs/document-intake-pipeline/
// medical-intelligence-layer.md — not this filter.
const HEALTH_CLAIM_VISIBLE_CATEGORIES = new Set([
  "mlcMedical", "dischargeSummary", "medicalBills", "disabilityCert",
  "policy", "photographs", "prevClaimHistory", "insuredStatement",
]);
const visibleDocCategories = (claimType) => claimType === "Health Claim"
  ? DOC_CATEGORIES.filter((cat) => HEALTH_CLAIM_VISIBLE_CATEGORIES.has(cat.key))
  : DOC_CATEGORIES;

const initialDocCategories = () => {
  const obj = {};
  DOC_CATEGORIES.forEach((cat) => { obj[cat.key] = { include: false, values: {} }; });
  return obj;
};

// Flattens the included, filled-in document categories into the plain text block
// every AI call (report generation, Legal & Investigation Intelligence modules) reads from.
const buildDocsText = (docCategories) => DOC_CATEGORIES
  .filter((cat) => docCategories[cat.key]?.include)
  .map((cat) => {
    const vals = docCategories[cat.key].values;
    const fieldLines = cat.fields.map((f) => (vals[f.key]?.trim() ? `${f.label}: ${vals[f.key].trim()}` : null)).filter(Boolean).join("\n");
    return fieldLines ? `--- ${cat.title} ---\n${fieldLines}` : null;
  })
  .filter(Boolean)
  .join("\n\n");

// ── Draft Persistence (Supabase report_drafts — synced across devices) ──
const CURRENT_DRAFT_KEY = "ki_current_draft_id"; // local pointer only; draft content lives in Supabase
const genDraftId = () => typeof crypto.randomUUID === "function" ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const DRAFT_COLUMNS = "id, claim_id, title, case_data, doc_categories, extra_notes, generated_report, legal_intelligence, updated_at, created_at";

let _cachedUserId = null;
const getCurrentUserId = async () => {
  if (_cachedUserId) return _cachedUserId;
  const { data: { user } } = await sb.auth.getUser();
  _cachedUserId = user?.id || null;
  return _cachedUserId;
};

const rowToDraft = (row) => ({
  id: row.id, claimId: row.claim_id, title: row.title,
  caseData: row.case_data || {}, docCategories: row.doc_categories || {},
  extraNotes: row.extra_notes || "", generatedReport: row.generated_report || null,
  legalIntelligence: row.legal_intelligence || null,
  updatedAt: row.updated_at,
});

const fetchDraftRow = async (id) => {
  const userId = await getCurrentUserId();
  if (!userId) return null;
  const { data, error } = await sb.from("report_drafts").select(DRAFT_COLUMNS).eq("id", id).eq("user_id", userId).maybeSingle();
  if (error || !data) return null;
  return rowToDraft(data);
};

const fetchLatestDraftRow = async () => {
  const userId = await getCurrentUserId();
  if (!userId) return null;
  const { data, error } = await sb.from("report_drafts").select(DRAFT_COLUMNS).eq("user_id", userId).order("updated_at", { ascending: false }).limit(1).maybeSingle();
  if (error || !data) return null;
  return rowToDraft(data);
};

const fetchDraftsList = async () => {
  const userId = await getCurrentUserId();
  if (!userId) return [];
  const { data, error } = await sb.from("report_drafts").select("id, title, updated_at").eq("user_id", userId).order("updated_at", { ascending: false }).limit(50);
  if (error) { console.error("Failed to fetch drafts list:", error); return []; }
  return data || [];
};

const upsertDraft = async (id, { title, caseData, docCategories, extraNotes, generatedReport, legalIntelligence, linkedClaim }) => {
  const userId = await getCurrentUserId();
  if (!userId) return;
  const { error } = await sb.from("report_drafts").upsert({
    id, user_id: userId, claim_id: linkedClaim?.id || null, title,
    case_data: caseData, doc_categories: docCategories, extra_notes: extraNotes,
    generated_report: generatedReport, legal_intelligence: legalIntelligence,
  }, { onConflict: "id" });
  if (error) console.error("Failed to save draft:", error);
};

const deleteDraftRow = async (id) => {
  const userId = await getCurrentUserId();
  if (!userId) return;
  const { error } = await sb.from("report_drafts").delete().eq("id", id).eq("user_id", userId);
  if (error) console.error("Failed to delete draft:", error);
};

const fetchClaimById = async (id) => {
  if (!id) return null;
  const { data, error } = await sb.from("claims").select("id, claim_number, claim_type_id, status, form_data, created_at").eq("id", id).maybeSingle();
  if (error) return null;
  return data;
};

const buildDraftTitle = (caseData) => {
  const parts = [];
  if (caseData.claimNo) parts.push("#" + caseData.claimNo);
  if (caseData.claimType) parts.push(caseData.claimType);
  if (caseData.insured) parts.push(caseData.insured);
  return parts.length ? parts.join(" — ") : "Untitled draft";
};

const timeAgo = (iso) => {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return Math.floor(diff / 86400) + "d ago";
};

// ── Main Report Tool ──
function InvestigationReportTool() {
  const [caseData, setCaseData] = useState(initialCase);
  const [docCategories, setDocCategories] = useState(initialDocCategories());
  const [extraNotes, setExtraNotes] = useState("");
  const [generating, setGenerating] = useState(false);
  const [report, setReport] = useState(null);
  const [error, setError] = useState(null);
  const [openSections, setOpenSections] = useState({ case: true, docs: true });
  const [expandedDocs, setExpandedDocs] = useState({});
  const [showSettings, setShowSettings] = useState(false);

  const updateCase = (field, value) => setCaseData((c) => ({ ...c, [field]: value }));
  const toggleDocInclude = (catKey) => setDocCategories((d) => ({...d,[catKey]:{...d[catKey],include:!d[catKey].include}}));
  const updateDocField = (catKey, fieldKey, value) => setDocCategories((d) => ({...d,[catKey]:{...d[catKey],values:{...d[catKey].values,[fieldKey]:value}}}));
  const toggleExpanded = (catKey) => setExpandedDocs((e) => ({ ...e, [catKey]: !e[catKey] }));
  const toggleSection = (key) => setOpenSections((s) => ({ ...s, [key]: !s[key] }));

  const [autoFilling, setAutoFilling] = useState({});
  const [autoFillError, setAutoFillError] = useState({});
  const [autoUpdating, setAutoUpdating] = useState(false);
  const [userEditedReport, setUserEditedReport] = useState(false);
  const [queueStatus, setQueueStatus] = useState(null);
  const debounceRef = useRef(null);
  const lastSnapshotRef = useRef("");

  // ── Claims linking (state declared early so draft persistence can reference it) ──
  const [claimsList, setClaimsList] = useState(null);
  const [linkedClaim, setLinkedClaim] = useState(null);
  const [claimsLoading, setClaimsLoading] = useState(false);
  const [showClaimPicker, setShowClaimPicker] = useState(false);
  const [claimSearch, setClaimSearch] = useState("");

  // ── Draft persistence ──
  const [currentDraftId, setCurrentDraftId] = useState(() => localStorage.getItem(CURRENT_DRAFT_KEY) || genDraftId());
  const [lastSaved, setLastSaved] = useState(null);
  const [showDraftPicker, setShowDraftPicker] = useState(false);
  const [draftsList, setDraftsList] = useState(null);
  const [draftsLoading, setDraftsLoading] = useState(false);
  const draftSaveRef = useRef(null);
  const draftLoadedRef = useRef(false);

  // ── Combined PDF Intake (Phase 1 — common, claim-agnostic foundation
  // only; see docs/document-intake-pipeline/phase-1-implementation-plan.md).
  // Additional entry point alongside per-category upload, not a
  // replacement — handleAutoFill above is untouched. ──
  const [intakeSession, setIntakeSession] = useState(null);
  const [intakeProcessing, setIntakeProcessing] = useState(false);
  const [intakeError, setIntakeError] = useState(null);
  const [intakeProgress, setIntakeProgress] = useState(null);
  const [intakeConfirming, setIntakeConfirming] = useState(false);
  const [intakeConfirmResults, setIntakeConfirmResults] = useState(null);

  const handleCombinedPdfUpload = async (file) => {
    if (!file) return;
    setIntakeError(null); setIntakeProgress(null); setIntakeProcessing(true);
    try {
      const userId = await getCurrentUserId();
      if (!userId) throw new Error("Session expired — please log in again.");
      const docCategoriesVocab = DOC_CATEGORIES.map((c) => ({ key: c.key, title: c.title }));
      const session = await IntakeService.processIntake(file, {
        draftId: currentDraftId, userId, docCategoriesVocab,
        onProgress: setIntakeProgress, onStatus: setQueueStatus,
      });
      setIntakeSession(session);
      if (session.status === "error") setIntakeError(session.error_message || "Intake could not reach a trustworthy grouping result.");
    } catch (e) {
      if (e.code === "PAGE_CEILING_EXCEEDED") {
        setIntakeError(e.message); // explicit rejection — no session was created, nothing to show beyond this message
      } else {
        setIntakeError(e.message || "Could not process this PDF.");
      }
    } finally {
      setIntakeProcessing(false);
    }
  };

  const refreshIntakeSession = async () => {
    if (!intakeSession) return;
    const updated = await IntakeService.getIntakeSession(intakeSession.id);
    setIntakeSession(updated);
  };

  // Confirm: the ONLY place intake output reaches docCategories, reusing
  // AIService.autoFillDocument and mergeFieldValues completely unchanged —
  // the exact same functions and merge behavior manual per-category upload
  // already uses (report.html:657-668).
  const handleConfirmIntake = async () => {
    if (!intakeSession) return;
    setIntakeConfirming(true); setIntakeConfirmResults(null);
    try {
      const confirmed = await IntakeService.confirmIntakeSession(intakeSession);
      setIntakeSession(confirmed);
      const results = [];
      for (const group of confirmed.document_groups) {
        if (!group.mappedDocCategory) { results.push({ groupId: group.groupId, status: "skipped", reason: "No matching document category — resolve in review before it can be extracted." }); continue; }
        const catObj = DOC_CATEGORIES.find((c) => c.key === group.mappedDocCategory);
        if (!catObj) { results.push({ groupId: group.groupId, status: "skipped", reason: "Unknown document category." }); continue; }
        try {
          const files = await IntakeService.getGroupFiles(group);
          const parsed = await AIService.autoFillDocument({ category: catObj, files }, { onStatus: setQueueStatus });
          setDocCategories((d) => ({ ...d, [catObj.key]: { include: true, values: mergeFieldValues(d[catObj.key].values, parsed) } }));
          setExpandedDocs((e) => ({ ...e, [catObj.key]: true }));
          results.push({ groupId: group.groupId, status: "extracted", category: catObj.title });
        } catch (e) {
          // Per-group failure isolation — one group's extraction failure
          // never blocks or loses the others' already-applied results.
          results.push({ groupId: group.groupId, status: "failed", category: catObj.title, error: e.message });
        }
      }
      setIntakeConfirmResults(results);
    } catch (e) {
      setIntakeError(e.message || "Could not confirm this intake session.");
    } finally {
      setIntakeConfirming(false);
    }
  };

  const dismissIntakeSession = () => { setIntakeSession(null); setIntakeError(null); setIntakeProgress(null); setIntakeConfirmResults(null); };

  useEffect(() => {
    if (draftLoadedRef.current) return;
    draftLoadedRef.current = true;
    (async () => {
      const savedId = localStorage.getItem(CURRENT_DRAFT_KEY);
      const draft = (savedId && await fetchDraftRow(savedId)) || await fetchLatestDraftRow();
      if (!draft) { setLegalIntelligence(await AIService.getLegalIntelligence({ caseData: initialCase })); return; }
      setCaseData(c => ({ ...initialCase, ...draft.caseData }));
      setDocCategories(() => {
        const base = initialDocCategories();
        for (const [k, v] of Object.entries(draft.docCategories || {})) { if (base[k]) base[k] = v; }
        return base;
      });
      setExtraNotes(draft.extraNotes || "");
      if (draft.generatedReport) { setReport(draft.generatedReport); setUserEditedReport(true); }
      setLegalIntelligence(draft.legalIntelligence || await AIService.getLegalIntelligence({ caseData: draft.caseData }));
      if (draft.claimId) setLinkedClaim(await fetchClaimById(draft.claimId));
      setLastSaved(draft.updatedAt);
      setCurrentDraftId(draft.id);
      localStorage.setItem(CURRENT_DRAFT_KEY, draft.id);
    })();
  }, []);

  const draftSnapshot = JSON.stringify({ caseData, docCategories, extraNotes, report, legalIntelligence, linkedClaim });
  useEffect(() => {
    if (!draftLoadedRef.current) return;
    if (draftSaveRef.current) clearTimeout(draftSaveRef.current);
    draftSaveRef.current = setTimeout(async () => {
      await upsertDraft(currentDraftId, { title: buildDraftTitle(caseData), caseData, docCategories, extraNotes, generatedReport: report, legalIntelligence, linkedClaim });
      setLastSaved(new Date().toISOString());
      localStorage.setItem(CURRENT_DRAFT_KEY, currentDraftId);
      setDraftsList(null); // invalidate cached list so the picker re-fetches fresh order/title
    }, 1500);
    return () => clearTimeout(draftSaveRef.current);
  }, [draftSnapshot, currentDraftId]);

  const openDraftPicker = async () => {
    setShowDraftPicker(v => !v);
    if (draftsList === null) {
      setDraftsLoading(true);
      setDraftsList(await fetchDraftsList());
      setDraftsLoading(false);
    }
  };

  const loadDraft = async (id) => {
    const draft = await fetchDraftRow(id);
    if (!draft) return;
    setCaseData({ ...initialCase, ...draft.caseData });
    const base = initialDocCategories();
    for (const [k, v] of Object.entries(draft.docCategories || {})) { if (base[k]) base[k] = v; }
    setDocCategories(base);
    setExtraNotes(draft.extraNotes || "");
    setReport(draft.generatedReport || null);
    setLegalIntelligence(draft.legalIntelligence || await AIService.getLegalIntelligence({ caseData: draft.caseData }));
    setLinkedClaim(draft.claimId ? await fetchClaimById(draft.claimId) : null);
    setCurrentDraftId(id);
    setLastSaved(draft.updatedAt);
    setUserEditedReport(!!draft.generatedReport);
    setShowDraftPicker(false);
    setDiagram(null);
    localStorage.setItem(CURRENT_DRAFT_KEY, id);
  };

  const newDraft = async () => {
    const id = genDraftId();
    setCaseData({...initialCase});
    setDocCategories(initialDocCategories());
    setExtraNotes("");
    setReport(null);
    setDiagram(null);
    setError(null);
    setLinkedClaim(null);
    setCurrentDraftId(id);
    setLastSaved(null);
    setUserEditedReport(false);
    setShowDraftPicker(false);
    setExpandedDocs({});
    localStorage.setItem(CURRENT_DRAFT_KEY, id);
    setLegalIntelligence(await AIService.getLegalIntelligence({ caseData: initialCase }));
  };

  const deleteDraft = async (id) => {
    await deleteDraftRow(id);
    setDraftsList(list => list ? list.filter(d => d.id !== id) : list);
    if (id === currentDraftId) newDraft();
  };

  // ── Claims linking (functions) ──
  const fetchClaims = async () => {
    if (claimsList) { setShowClaimPicker(true); return; }
    setClaimsLoading(true);
    try {
      const { data, error } = await sb.from("claims").select("id, claim_number, claim_type_id, status, form_data, created_at").order("created_at", { ascending: false }).limit(100);
      if (error) throw error;
      setClaimsList(data || []);
      setShowClaimPicker(true);
    } catch (e) { console.error("Failed to fetch claims:", e); setClaimsList([]); setShowClaimPicker(true); }
    finally { setClaimsLoading(false); }
  };

  const linkClaim = (claim) => {
    setLinkedClaim(claim);
    setShowClaimPicker(false);
    const fd = claim.form_data || {};
    const typeMap = { mact: "MACT Death Claim", motor_od: "TPPD Claim", tp: "TPPD Claim", health: "Health Claim" };
    setCaseData(c => ({
      ...c,
      claimNo: claim.claim_number || c.claimNo,
      claimType: typeMap[claim.claim_type_id] || c.claimType,
      policyNo: fd.policy_number || c.policyNo,
      doa: fd.accident_date || fd.incident_date || fd.theft_date || c.doa,
      ivVehicle: fd.vehicle_numbers || fd.insured_vehicle || fd.vehicle_reg || c.ivVehicle,
      court: fd.court_name || c.court,
      claimAmount: fd.claim_amount ? "₹" + Number(fd.claim_amount).toLocaleString("en-IN") : c.claimAmount,
      insured: fd.claimant_name || fd.patient_name || fd.tp_name || c.insured,
    }));
  };

  const unlinkClaim = () => { setLinkedClaim(null); };

  const filteredClaims = (claimsList || []).filter(c => {
    if (!claimSearch) return true;
    const s = claimSearch.toLowerCase();
    const fd = c.form_data || {};
    return (c.claim_number || "").toLowerCase().includes(s)
      || (c.claim_type_id || "").toLowerCase().includes(s)
      || (fd.claimant_name || "").toLowerCase().includes(s)
      || (fd.policy_number || "").toLowerCase().includes(s)
      || (fd.vehicle_numbers || fd.insured_vehicle || "").toLowerCase().includes(s);
  });

  const mergeFieldValues = (oldValues, newValues) => {
    const merged = { ...oldValues };
    for (const [key, rawNewVal] of Object.entries(newValues || {})) {
      const newVal = (rawNewVal || "").toString().trim();
      const oldVal = (oldValues?.[key] || "").toString().trim();
      if (!newVal) continue;
      if (!oldVal) { merged[key] = newVal; }
      else if (oldVal === newVal || oldVal.includes(newVal)) { merged[key] = oldVal; }
      else { merged[key] = `${oldVal}\n\n${newVal}`; }
    }
    return merged;
  };

  const handleAutoFill = async (cat, files) => {
    if (!files || files.length === 0) return;
    setAutoFilling((s) => ({ ...s, [cat.key]: true }));
    setAutoFillError((s) => ({ ...s, [cat.key]: null }));
    try {
      const parsed = await AIService.autoFillDocument({ category: cat, files }, { onStatus: setQueueStatus });
      setDocCategories((d) => ({...d,[cat.key]:{include:true,values:mergeFieldValues(d[cat.key].values,parsed)}}));
      setExpandedDocs((e) => ({ ...e, [cat.key]: true }));
    } catch (e) {
      setAutoFillError((s) => ({ ...s, [cat.key]: e.message || "Could not read document." }));
    } finally { setAutoFilling((s) => ({ ...s, [cat.key]: false })); }
  };

  const [headerAutoFilling, setHeaderAutoFilling] = useState(false);
  const [headerAutoFillError, setHeaderAutoFillError] = useState(null);

  const handleHeaderAutoFill = async (files) => {
    if (!files || files.length === 0) return;
    setHeaderAutoFilling(true); setHeaderAutoFillError(null);
    try {
      const parsed = await AIService.autoFillCaseHeader({ files }, { onStatus: setQueueStatus });
      setCaseData((c) => {
        const updated = { ...c };
        for (const [key, val] of Object.entries(parsed || {})) {
          const trimmed = (val || "").toString().trim();
          if (!trimmed) continue;

        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {lastSaved && <span style={{fontSize:10.5,color:"#6B7F9A"}}>Saved {timeAgo(lastSaved)}</span>}
          <div style={{position:"relative"}}>
            <button onClick={openDraftPicker} style={{background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:4,padding:"6px 12px",fontSize:12,fontWeight:600,color:"#FAF8F4",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
              <Icon.FileText size={13} /> Saved drafts <Icon.ChevronDown size={12} />
            </button>
            {showDraftPicker && (
              <div style={{position:"absolute",right:0,top:"calc(100% + 6px)",background:"#fff",border:"1px solid #D8D2C4",borderRadius:6,boxShadow:"0 8px 24px rgba(0,0,0,0.15)",width:340,zIndex:999,maxHeight:400,overflow:"auto"}}>
                <div style={{padding:"12px 14px",borderBottom:"1px solid #E3DDD0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,fontSize:13,color:"#1B2A4A"}}>Saved drafts</span>
                  <button onClick={newDraft} style={{background:"#1B2A4A",color:"#fff",border:"none",borderRadius:4,padding:"5px 12px",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>+ New draft</button>
                </div>
                {draftsLoading && (
                  <div style={{padding:"20px 14px",textAlign:"center",color:"#857F6E"}}><Icon.Loader2 size={14} /></div>
                )}
                {!draftsLoading && (draftsList||[]).map(d => (
                  <div key={d.id} onClick={()=>loadDraft(d.id)} style={{padding:"10px 14px",borderBottom:"1px solid #F0EDE6",cursor:"pointer",background:d.id===currentDraftId?"#F0EDE6":"#fff",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                    onMouseEnter={e=>{ if(d.id!==currentDraftId) e.currentTarget.style.background="#F8F6F0"; }}
                    onMouseLeave={e=>{ e.currentTarget.style.background=d.id===currentDraftId?"#F0EDE6":"#fff"; }}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:600,color:"#1B2A4A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.title||"Untitled draft"}</div>
                      <div style={{fontSize:10.5,color:"#857F6E",marginTop:2}}>{timeAgo(d.updated_at)}{d.id===currentDraftId ? " · current" : ""}</div>
                    </div>
                    {d.id!==currentDraftId && (
                      <button onClick={e=>{e.stopPropagation();deleteDraft(d.id);}} title="Delete draft" style={{background:"none",border:"none",cursor:"pointer",padding:"4px",color:"#A8362B",fontSize:14,lineHeight:1}}>×</button>
                    )}
                  </div>
                ))}
                {!draftsLoading && (draftsList||[]).length === 0 && (
                  <div style={{padding:"20px 14px",fontSize:12.5,color:"#857F6E",textAlign:"center"}}>No saved drafts yet. Your work is auto-saved.</div>
                )}
              </div>
            )}
          </div>
          <button onClick={newDraft} style={{background:"rgba(201,168,76,0.2)",border:"1px solid rgba(201,168,76,0.4)",borderRadius:4,padding:"6px 12px",fontSize:12,fontWeight:600,color:"#e2c17a",cursor:"pointer"}}>+ New</button>
        </div>
      </div>

      {queueStatus && (
        <div style={{background:"#FFF4E0",borderBottom:"1px solid #E8D5A8",padding:"8px 28px",fontSize:12,color:"#8A5A1E",display:"flex",alignItems:"center",gap:8}}>
          <Icon.Loader2 size={13} /> {queueStatus}
        </div>
      )}

      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:0,alignItems:"start" }}>
        {/* LEFT: INPUT */}
        <div style={{padding:"24px 28px",maxWidth:640,margin:"0 auto",width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <SectionHeader title="Case header" open={openSections.case} onToggle={()=>toggleSection("case")} />
            <label className="ir-btn-ghost" style={{cursor:"pointer",fontSize:11,padding:"5px 9px",marginBottom:10}}>
              {headerAutoFilling ? <Icon.Loader2 size={12} /> : <Icon.Upload size={12} />}
              {headerAutoFilling ? "Reading…" : "Upload to auto-fill"}
              <input type="file" accept="image/*,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple style={{display:"none"}} disabled={headerAutoFilling} onChange={(e)=>handleHeaderAutoFill(e.target.files)} />
            </label>
          </div>
          {headerAutoFillError && <div style={{margin:"0 0 10px",padding:"8px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:11.5,color:"#A8362B",lineHeight:1.5}}>{headerAutoFillError}</div>}
          {openSections.case && <div style={{fontSize:11,color:"#857F6E",marginBottom:8,marginTop:-6}}>Upload a claim intimation letter, policy copy, RC, petition, or FIR to auto-fill.</div>}
          {openSections.case && (
            <div style={{position:"relative",marginBottom:10}}>
              {linkedClaim ? (
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:"#EEF4ED",border:"1px solid #B8D4B0",borderRadius:6,fontSize:12}}>
                  <Icon.Link size={13} color="#3A7D2A" />
                  <span style={{color:"#2D5E22",fontWeight:600}}>{linkedClaim.claim_number}</span>
                  <span style={{color:"#5A8A4E"}}>{linkedClaim.claim_type_id?.toUpperCase()}</span>
                  <span style={{color:"#7BA06E",fontSize:11}}>— fields auto-filled</span>
                  <button onClick={unlinkClaim} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#8A5A5A",fontSize:11,textDecoration:"underline",padding:0}}>Unlink</button>
                </div>
              ) : (
                <button onClick={fetchClaims} disabled={claimsLoading} className="ir-btn-ghost" style={{fontSize:11,padding:"6px 12px",display:"flex",alignItems:"center",gap:6}}>
                  {claimsLoading ? <Icon.Loader2 size={12} /> : <Icon.Link size={12} />}
                  {claimsLoading ? "Loading claims…" : "Link to existing claim"}
                </button>
              )}
              {showClaimPicker && (
                <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:50,background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,boxShadow:"0 8px 24px rgba(0,0,0,.12)",maxHeight:320,display:"flex",flexDirection:"column"}}>
                  <div style={{padding:"8px 10px",borderBottom:"1px solid #E3DDD0",display:"flex",alignItems:"center",gap:8}}>
                    <Icon.Search size={13} color="#A6A595" />
                    <input value={claimSearch} onChange={e=>setClaimSearch(e.target.value)} placeholder="Search by claim no., name, policy, vehicle…" autoFocus style={{flex:1,border:"none",outline:"none",fontSize:12,fontFamily:"Inter",background:"transparent"}} />
                    <button onClick={()=>{setShowClaimPicker(false);setClaimSearch("");}} style={{background:"none",border:"none",cursor:"pointer",padding:2}}><Icon.X size={14} color="#A6A595" /></button>
                  </div>
                  <div style={{overflowY:"auto",flex:1}}>
                    {filteredClaims.length === 0 && <div style={{padding:"16px",textAlign:"center",fontSize:12,color:"#A6A595"}}>No claims found</div>}
                    {filteredClaims.map(c => {
                      const fd = c.form_data || {};
                      const name = fd.claimant_name || fd.patient_name || fd.tp_name || "";
                      return (
                        <div key={c.id} onClick={()=>linkClaim(c)} style={{padding:"10px 12px",cursor:"pointer",borderBottom:"1px solid #F0ECE4",display:"flex",alignItems:"center",gap:10,transition:"background .1s"}} onMouseEnter={e=>e.currentTarget.style.background="#F8F6F0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:12,fontWeight:600,color:"#1B2A4A"}}>{c.claim_number} <span style={{fontWeight:400,color:"#857F6E",textTransform:"uppercase",fontSize:10}}>{c.claim_type_id}</span></div>
                            {name && <div style={{fontSize:11,color:"#857F6E",marginTop:2}}>{name}{fd.policy_number ? ` · ${fd.policy_number}` : ""}</div>}
                          </div>
                          <span style={{fontSize:10,color:"#A6A595"}}>{new Date(c.created_at).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"})}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
          {openSections.case && (
            <div style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,padding:16,marginBottom:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <SelectField label="Claim type" value={caseData.claimType} onChange={(v)=>updateCase("claimType",v)} options={["MACT Death Claim","MACT Injury Claim","TPPD Claim","Health Claim"]} />
              <Field label="Claim no." value={caseData.claimNo} onChange={(v)=>updateCase("claimNo",v)} />
              <Field label="Court / jurisdiction" value={caseData.court} onChange={(v)=>updateCase("court",v)} />
              <Field label="Claim amount" value={caseData.claimAmount} onChange={(v)=>updateCase("claimAmount",v)} />
              <Field label="Date of accident" value={caseData.doa} onChange={(v)=>updateCase("doa",v)} />
              <Field label="Insured vehicle no." value={caseData.ivVehicle} onChange={(v)=>updateCase("ivVehicle",v)} />
              <Field label="Insured" value={caseData.insured} onChange={(v)=>updateCase("insured",v)} />
              <Field label="Policy no. & period" value={caseData.policyNo} onChange={(v)=>updateCase("policyNo",v)} />
            </div>
          )}

          <SectionHeader title="Source documents & statements" open={openSections.docs} onToggle={()=>toggleSection("docs")} />
          {openSections.docs && (
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11.5,color:"#857F6E",marginBottom:10,lineHeight:1.5}}>
                Tick a document and either fill manually or use "Upload to auto-fill" with JPG/PNG/PDF/Word files — up to 20 pages per upload. Supports Hindi, Gujarati, Marathi, Tamil, Telugu, Kannada, Malayalam, Bengali, Punjabi, Odia, Assamese, Urdu and English.
              </div>
              {caseData.claimType === "Health Claim" && (
                <div style={{fontSize:11,color:"#B8762E",marginBottom:10,lineHeight:1.5,fontStyle:"italic"}}>
                  Showing only documents relevant to a Health Claim. FIR/Panchnama/vehicle documents etc. are hidden for this claim type — switch Claim type above if you need them.
                </div>
              )}
              <CombinedPdfUpload
                processing={intakeProcessing} error={intakeError} progress={intakeProgress}
                onUpload={handleCombinedPdfUpload} onDismissError={()=>setIntakeError(null)}
              />
              {intakeSession && intakeSession.status === "ready_for_review" && (
                <IntakeReviewScreen
                  session={intakeSession} docCategories={DOC_CATEGORIES}
                  onSessionChange={setIntakeSession} onRefresh={refreshIntakeSession}
                  onConfirm={handleConfirmIntake} confirming={intakeConfirming}
                  confirmResults={intakeConfirmResults} onDismiss={dismissIntakeSession}
                />
              )}
              {intakeSession && intakeSession.status === "confirmed" && intakeConfirmResults && (
                <div style={{background:"#F0F4EC",border:"1px solid #C7D9BC",borderRadius:6,padding:"12px 14px",marginBottom:12,fontSize:12,fontFamily:"Inter"}}>
                  <div style={{fontWeight:700,color:"#3F6B3F",marginBottom:6}}>Combined PDF intake confirmed — {intakeConfirmResults.filter(r=>r.status==="extracted").length} of {intakeConfirmResults.length} groups extracted into the categories below.</div>
                  {intakeConfirmResults.filter(r=>r.status!=="extracted").map((r) => (
                    <div key={r.groupId} style={{color:"#A8362B",marginTop:2}}>{r.category||r.groupId}: {r.reason||r.error} — retype and confirm again, or fill this category manually.</div>
                  ))}
                  <button className="ir-btn-ghost" style={{marginTop:8}} onClick={dismissIntakeSession}>Dismiss</button>
                </div>
              )}
              {visibleDocCategories(caseData.claimType).map((cat) => {
                const state = docCategories[cat.key];
                const isOpen = !!expandedDocs[cat.key];
                return (
                  <div key={cat.key} style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,marginBottom:8,overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer"}} onClick={()=>toggleExpanded(cat.key)}>
                      <input type="checkbox" checked={state.include} onChange={(e)=>{e.stopPropagation();toggleDocInclude(cat.key);if(!state.include)setExpandedDocs((ex)=>({...ex,[cat.key]:true}));}} onClick={(e)=>e.stopPropagation()} style={{width:15,height:15,accentColor:"#1B2A4A"}} />
                      <span style={{fontFamily:"Inter",fontWeight:600,fontSize:13,color:state.include?"#1B2A4A":"#A6A595",flex:1}}>{cat.title}</span>
                      <label className="ir-btn-ghost" style={{cursor:"pointer",fontSize:11,padding:"5px 9px"}} onClick={(e)=>e.stopPropagation()}>
                        {autoFilling[cat.key] ? <Icon.Loader2 size={12} /> : <Icon.Upload size={12} />}
                        {autoFilling[cat.key] ? "Reading…" : "Upload to auto-fill"}
                        <input type="file" accept="image/*,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple style={{display:"none"}} disabled={autoFilling[cat.key]} onChange={(e)=>handleAutoFill(cat,e.target.files)} />
                      </label>
                      {isOpen ? <Icon.ChevronDown size={14} color="#A6A595" /> : <Icon.ChevronRight size={14} color="#A6A595" />}
                    </div>
                    {autoFillError[cat.key] && <div style={{margin:"0 14px 10px",padding:"8px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:11.5,color:"#A8362B",lineHeight:1.5}}>{autoFillError[cat.key]}</div>}
                    {isOpen && (
                      <div style={{padding:"4px 14px 14px",display:"grid",gap:10}}>
                        {cat.fields.map((f) => {
                          const hasValue = !!(state.values[f.key] || "").trim();
                          return (
                            <div key={f.key}>
                              <span className="ir-label" style={{display:"flex",alignItems:"center",gap:5}}>
                                {f.label}
                                {hasValue && <Icon.Sparkles size={11} color="#B8762E" style={{display:"inline",verticalAlign:"middle"}} />}
                              </span>
                              {f.options ? (
                                <select className="ir-input" style={{cursor:"pointer"}} value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)}>
                                  <option value="">— Select —</option>
                                  {f.options.map((opt)=><option key={opt} value={opt}>{opt}</option>)}
                                </select>
                              ) : f.area ? (
                                <textarea className="ir-textarea" value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)} />
                              ) : (
                                <input className="ir-input" value={state.values[f.key]||""} onChange={(e)=>updateDocField(cat.key,f.key,e.target.value)} />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <div className="ir-label">Investigator field notes (optional)</div>
          <textarea className="ir-textarea" style={{minHeight:90,marginBottom:18}} placeholder="Anything from your own field visits not captured above…" value={extraNotes} onChange={(e)=>setExtraNotes(e.target.value)} />

          <button className="ir-btn-primary" onClick={()=>generateReport()} disabled={generating} style={{width:"100%",justifyContent:"center"}}>
            {generating ? <Icon.Loader2 size={16} /> : <Icon.FileText size={16} />}
            {generating ? "Drafting report…" : report ? "Regenerate full report" : "Generate report draft"}
          </button>
          <div style={{fontSize:11,color:"#A6A595",marginTop:6}}>
            Report auto-updates ~2s after changes unless you've edited the draft manually.
          </div>
          {error && <div style={{marginTop:12,padding:10,background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:12.5,color:"#A8362B"}}>{error}</div>}
        </div>

        {/* RIGHT: REPORT PREVIEW */}
        <div style={{background:"#FAF8F4",minHeight:"calc(100vh - 120px)",borderLeft:"1px solid #E3DDD0",padding:"24px 28px"}}>
          <div style={{maxWidth:640,margin:"0 auto"}}>
            {!report && !generating && (
              <div style={{textAlign:"center",padding:"80px 20px",color:"#A6A595"}}>
                <Icon.FileText size={32} style={{marginBottom:10,opacity:0.5}} />
                <div style={{fontFamily:"Lora",fontSize:14.5}}>Fill in a document on the left and the draft report will appear here automatically.</div>
              </div>
            )}
            {generating && (
              <div style={{textAlign:"center",padding:"80px 20px",color:"#5A5546"}}>
                <Icon.Loader2 size={26} style={{marginBottom:10}} />
                <div style={{fontFamily:"Lora",fontSize:14}}>Synthesizing statements and drafting sections…</div>
              </div>
            )}
            {report && (
              <div style={{background:"#fff",border:"1px solid #E3DDD0",borderRadius:6,padding:"28px 30px",fontFamily:"Lora"}}>
                <div style={{borderBottom:"2px solid #1B2A4A",paddingBottom:12,marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:11,fontFamily:"Inter",fontWeight:700,letterSpacing:"0.06em",color:"#1B2A4A",textTransform:"uppercase"}}>Investigation Report — Draft</div>
                    <div style={{fontSize:12,color:"#857F6E",marginTop:2,fontFamily:"Inter"}}>{caseData.claimType||"Claim type not set"} {caseData.claimNo && `· #${caseData.claimNo}`}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                    {autoUpdating && <div style={{fontSize:10.5,fontFamily:"Inter",color:"#B8762E",display:"flex",alignItems:"center",gap:5}}><Icon.Loader2 size={11} /> Updating…</div>}
                    <div style={{display:"flex",gap:6}}>
                      <button className="ir-btn-ghost" onClick={downloadAsPDF} style={{fontWeight:600}}><Icon.FileText size={12} /> PDF</button>
                      <button className="ir-btn-ghost" onClick={downloadAsWord}><Icon.FileText size={12} /> Word</button>
                      <button className="ir-btn-ghost" onClick={downloadAsText}><Icon.FileText size={12} /> Text</button>
                    </div>
                  </div>
                </div>

                {DOC_CATEGORIES.filter((cat) => docCategories[cat.key]?.include && report.sections?.[cat.key]).length > 0 && (
                  <div style={{marginBottom:4}}>
                    <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:10}}>Document-wise Briefs</div>
                    {DOC_CATEGORIES.filter((cat) => docCategories[cat.key]?.include && report.sections?.[cat.key]).map((cat) => (
                      <EditableSection key={cat.key} title={cat.title} text={report.sections[cat.key]} onChange={(v)=>updateReportSection(cat.key,v)} />
                    ))}
                  </div>
                )}

                {(diagram || diagramLoading || diagramError) && <AccidentDiagram diagram={diagram} loading={diagramLoading} error={diagramError} />}
                <div style={{marginBottom:18}}>
                  <button className="ir-btn-ghost" onClick={generateDiagram} disabled={diagramLoading}>
                    {diagramLoading ? <Icon.Loader2 size={13} /> : <Icon.Sparkles size={13} />}
                    {diagram ? "Regenerate accident schematic" : "Generate accident schematic"}
                  </button>
                </div>

                {report.redFlags?.length > 0 && (
                  <div style={{marginBottom:20,paddingTop:4,borderTop:"1px solid #E3DDD0"}}>
                    <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:8,marginTop:14,display:"flex",alignItems:"center",gap:6}}>
                      <Icon.AlertTriangle size={13} color="#A8362B" /> Red Flags ({report.redFlags.length})
                    </div>
                    {report.redFlags.map((rf, i) => (
                      <div key={i} style={{borderLeft:`3px solid ${severityColor(rf.severity)}`,paddingLeft:10,marginBottom:8}}>
                        <div style={{fontFamily:"Inter",fontSize:12.5,fontWeight:600,color:"#1B2A4A"}}>
                          {rf.flag} <span style={{fontSize:10,fontWeight:700,color:severityColor(rf.severity),textTransform:"uppercase",marginLeft:4}}>{rf.severity}</span>
                        </div>
                        <div style={{fontSize:13,color:"#3A3528",lineHeight:1.5}}>{rf.detail}</div>
                      </div>
                    ))}
                  </div>
                )}
                {report.redFlags?.length === 0 && (
                  <div style={{marginBottom:20,paddingTop:14,borderTop:"1px solid #E3DDD0",fontSize:12.5,fontFamily:"Inter",color:"#5A8266"}}>
                    No discrepancies flagged from the provided documents.
                  </div>
                )}

                <div style={{paddingTop:4,borderTop:"2px solid #1B2A4A",marginTop:6}}>
                  <div style={{fontFamily:"Inter",fontSize:10,fontWeight:700,letterSpacing:"0.06em",color:"#857F6E",textTransform:"uppercase",marginTop:14,marginBottom:14}}>Synthesis — all documents combined</div>
                  <EditableSection title="Findings" text={report.findings} onChange={(v)=>updateReportField("findings",v)} />
                  <EditableSection title="Observations" text={report.observations} onChange={(v)=>updateReportField("observations",v)} />
                  <EditableSection title="Conclusion" text={report.conclusion} onChange={(v)=>updateReportField("conclusion",v)} />
                </div>

                <LegalIntelligenceSection data={legalIntelligence} loading={legalIntelligenceLoading} error={legalIntelligenceError} onRefresh={refreshLegalIntelligence} />

                <div style={{fontSize:10.5,fontFamily:"Inter",color:"#A6A595",marginTop:24,paddingTop:12,borderTop:"1px solid #E3DDD0",lineHeight:1.5}}>
                  AI-generated draft — editable above. Verify all translated content and conclusions against source documents before issuing.
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ title, open, onToggle }) {
  return (
    <button onClick={onToggle} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",cursor:"pointer",padding:"4px 0",marginBottom:10,width:"100%"}}>
      {open ? <Icon.ChevronDown size={15} color="#1B2A4A" /> : <Icon.ChevronRight size={15} color="#1B2A4A" />}
      <span style={{fontFamily:"Inter",fontWeight:700,fontSize:13,color:"#1B2A4A",letterSpacing:"0.01em"}}>{title}</span>
    </button>
  );
}

function Field({ label, value, onChange }) {
  return (<div><span className="ir-label">{label}</span><input className="ir-input" value={value} onChange={(e)=>onChange(e.target.value)} /></div>);
}

function SelectField({ label, value, onChange, options }) {
  return (<div><span className="ir-label">{label}</span><select className="ir-input" value={value} onChange={(e)=>onChange(e.target.value)} style={{cursor:"pointer"}}>{options.map((opt)=><option key={opt} value={opt}>{opt}</option>)}</select></div>);
}

function EditableSection({ title, text, onChange }) {
  const [focused, setFocused] = useState(false);
  if (!text && !focused) return null;
  return (
    <div style={{marginBottom:18}}>
      <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:6}}>{title}</div>
      <textarea value={text||""} onChange={(e)=>onChange(e.target.value)} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
        style={{width:"100%",fontFamily:"Lora",fontSize:14,lineHeight:1.65,color:"#2A2618",border:focused?"1px solid #1B2A4A":"1px solid transparent",borderRadius:4,padding:"4px 6px",margin:"-4px -6px",resize:"vertical",minHeight:60,background:focused?"#FAF8F4":"transparent"}}
      />
    </div>
  );
}

function AccidentDiagram({ diagram, loading, error }) {
  if (loading) return <div style={{marginBottom:18,textAlign:"center",padding:"30px 0",color:"#5A5546",fontFamily:"Inter",fontSize:12.5,background:"#F4F1EA",border:"1px solid #E3DDD0",borderRadius:6}}><Icon.Loader2 size={18} style={{marginBottom:6}} /><div>Building schematic…</div></div>;
  if (error) return <div style={{marginBottom:18,padding:12,background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:6,fontSize:12.5,fontFamily:"Inter",color:"#A8362B"}}>{error}</div>;
  if (!diagram) return null;
  const W = 560, H = 220;
  const roadStart = 40, roadEnd = W - 40;
  const posToX = (p) => roadStart + (Math.min(100, Math.max(0, p)) / 100) * (roadEnd - roadStart);
  const laneY = { near: H / 2 + 28, far: H / 2 - 28 };
  const arrowFor = (dir) => dir === "left" ? "←" : dir === "right" ? "→" : dir === "up" ? "↑" : "↓";
  return (
    <div style={{marginBottom:18}}>
      <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase",marginBottom:6}}>
        Accident Schematic {diagram.confidence === "low" && <span style={{color:"#B8762E",fontWeight:600,fontSize:10}}>(LOW CONFIDENCE)</span>}
      </div>
      <div style={{background:"#F4F1EA",border:"1px solid #E3DDD0",borderRadius:6,padding:12}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
          <rect x={roadStart} y={H/2-45} width={roadEnd-roadStart} height={90} fill="#DCD6C7" />
          <line x1={roadStart} y1={H/2} x2={roadEnd} y2={H/2} stroke="#fff" strokeWidth="2" strokeDasharray="10,8" />
          <text x={W/2} y={H/2-55} textAnchor="middle" fontFamily="Inter" fontSize="11" fontWeight="600" fill="#5A5546">{diagram.roadDescription||"Road"}</text>
          {diagram.impactPoint != null && (<g><circle cx={posToX(diagram.impactPoint)} cy={H/2} r="6" fill="#A8362B" opacity="0.85" /><text x={posToX(diagram.impactPoint)} y={H/2+50} textAnchor="middle" fontFamily="Inter" fontSize="10" fontWeight="700" fill="#A8362B">IMPACT</text></g>)}
          {(diagram.vehicles||[]).map((v, i) => {
            const x = posToX(v.position ?? 50);
            const y = laneY[v.lane] || H / 2;
            const fill = v.role === "striking" ? "#1B2A4A" : v.role === "struck" ? "#A8362B" : "#5A5546";
            return (<g key={i}><rect x={x-32} y={y-12} width="64" height="24" rx="4" fill={fill} /><text x={x} y={y+4} textAnchor="middle" fontFamily="Inter" fontSize="13" fontWeight="700" fill="#fff">{arrowFor(v.direction)}</text><text x={x} y={y+26} textAnchor="middle" fontFamily="Inter" fontSize="9.5" fill="#2A2618">{v.label}</text></g>);
          })}
        </svg>
        {diagram.notes && <div style={{fontFamily:"Lora",fontSize:12.5,fontStyle:"italic",color:"#5A5546",marginTop:6,textAlign:"center"}}>{diagram.notes}</div>}
      </div>
      <div style={{fontSize:10.5,fontFamily:"Inter",color:"#A6A595",marginTop:6}}>Schematic from FIR/panchnama text — not a substitute for official spot panchnama.</div>
    </div>
  );
}

// Stored/exchanged as ISO (contract requirement, machine-parseable, shared with Bima
// Anveshak) — this only formats it for on-screen/export display as dd/mm/yyyy.
const formatDateDMY = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "2-digit", year: "numeric" });
};

// Status pill styling — shared by the report preview and (later) admin/QC views.
// Vocabulary is fixed to exactly these 4 values by the approved shared contract.
const LEGAL_STATUS_STYLE = {
  "Completed": { color: "#5A8266", label: "Completed" },
  "Pending Verification": { color: "#B8762E", label: "Pending Verification" },
  "Not Performed": { color: "#A6A595", label: "Not Performed" },
  "Not Applicable": { color: "#C7C2B3", label: "Not Applicable" },
};

function ModuleCard({ module }) {
  const [open, setOpen] = useState(false);
  const style = LEGAL_STATUS_STYLE[module.status] || LEGAL_STATUS_STYLE["Not Performed"];
  const hasDetail = (module.status === "Completed" || module.status === "Pending Verification")
    && (module.summary || module.details);
  return (
    <div style={{borderBottom:"1px solid #EFEAE0",padding:"9px 0"}}>
      <div
        onClick={() => hasDetail && setOpen((v) => !v)}
        style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,cursor:hasDetail?"pointer":"default"}}
      >
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          {hasDetail && (open ? <Icon.ChevronDown size={12} color="#857F6E" /> : <Icon.ChevronRight size={12} color="#857F6E" />)}
          <span style={{fontFamily:"Inter",fontSize:12.5,fontWeight:600,color:"#1B2A4A",fontStyle:module.status==="Not Applicable"?"italic":"normal"}}>{module.moduleLabel}</span>
        </div>
        <span style={{fontFamily:"Inter",fontSize:9.5,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",color:style.color,border:`1px solid ${style.color}`,borderRadius:10,padding:"2px 8px",whiteSpace:"nowrap"}}>{style.label}</span>
      </div>
      {open && hasDetail && (
        <div style={{marginTop:8,paddingLeft:19,fontFamily:"Lora",fontSize:12.5,color:"#3A3528",lineHeight:1.55}}>
          {module.summary && <div>{module.summary}</div>}
          {module.details && <div style={{marginTop:4,color:"#5A5546"}}>{module.details}</div>}
          <div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:"4px 14px",fontFamily:"Inter",fontSize:10.5,color:"#A6A595"}}>
            {module.confidence && <span>Confidence: {module.confidence}</span>}
            {module.source && <span>Source: {module.source}</span>}
            {module.asOf && <span>As of: {formatDateDMY(module.asOf)}</span>}
            {module.verifiedBy && <span>Verified by: {module.verifiedBy}</span>}
          </div>
          {module.references?.length > 0 && <div style={{marginTop:4,fontFamily:"Inter",fontSize:10.5,color:"#A6A595"}}>References: {module.references.join(", ")}</div>}
        </div>
      )}
    </div>
  );
}

function LegalIntelligenceSection({ data, loading, error, onRefresh }) {
  return (
    <div style={{marginTop:24,paddingTop:14,borderTop:"2px solid #1B2A4A"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div style={{fontFamily:"Inter",fontSize:11.5,fontWeight:700,letterSpacing:"0.04em",color:"#1B2A4A",textTransform:"uppercase"}}>Legal &amp; Investigation Intelligence</div>
        <button className="ir-btn-ghost" onClick={onRefresh} disabled={loading}>
          {loading ? <Icon.Loader2 size={12} /> : <Icon.Sparkles size={12} />}
          Refresh
        </button>
      </div>
      <div style={{fontSize:11.5,fontFamily:"Inter",color:"#A6A595",marginBottom:10}}>
        Reserved for the Bima Anveshak AI Engine — each module below will populate automatically once that integration ships.
      </div>
      {error && <div style={{marginBottom:10,padding:"8px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:12,fontFamily:"Inter",color:"#A8362B"}}>{error}</div>}
      {Array.isArray(data?.modules) ? (
        <div>{data.modules.map((m) => <ModuleCard key={m.moduleId} module={m} />)}</div>

        <div style={{fontSize:12.5,fontFamily:"Inter",color:"#A6A595",fontStyle:"italic"}}>Not yet generated for this draft — click Refresh.</div>

}

// ── Combined PDF Intake — Phase 1 review UI ──
// Common, claim-agnostic intake foundation only (see
// docs/document-intake-pipeline/phase-1-implementation-plan.md §6). These
// components never reference Health/TP-specific vocabulary — they render
// whatever IntakeService/intake_review_sessions produce generically.

function CombinedPdfUpload({ processing, error, progress, onUpload, onDismissError }) {
  const progressLabel = !progress ? null
    : progress.stage === "rendering" ? `Rendering page ${progress.rendered} of ${progress.total}…`
    : progress.stage === "uploading" ? `Storing page ${progress.uploaded} of ${progress.total}…`
    : null;
  return (
    <div style={{background:"#F8F6F0",border:"1px dashed #C9A84C",borderRadius:6,padding:"12px 14px",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        <div>
          <div style={{fontFamily:"Inter",fontWeight:600,fontSize:12.5,color:"#1B2A4A"}}>Upload Combined PDF</div>
          <div style={{fontSize:11,color:"#857F6E",marginTop:2,lineHeight:1.5}}>
            One PDF containing multiple documents — up to the configured page ceiling ({IntakeService.getConfig().pageCeiling} pages). Every page is classified, grouped, and held for your review before anything is added below.
          </div>
        </div>
        <label className="ir-btn-ghost" style={{cursor:processing?"default":"pointer",fontSize:11,padding:"6px 10px",flexShrink:0}}>
          {processing ? <Icon.Loader2 size={12} /> : <Icon.Upload size={12} />}
          {processing ? "Processing…" : "Upload combined PDF"}
          <input type="file" accept="application/pdf,.pdf" style={{display:"none"}} disabled={processing}
            onChange={(e)=>{ const f=e.target.files && e.target.files[0]; e.target.value=""; if (f) onUpload(f); }} />
        </label>
      </div>
      {progressLabel && <div style={{marginTop:8,fontSize:11,fontFamily:"Inter",color:"#B8762E"}}>{progressLabel}</div>}
      {error && (
        <div style={{marginTop:8,padding:"8px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:11.5,color:"#A8362B",lineHeight:1.5,display:"flex",justifyContent:"space-between",gap:10}}>
          <span>{error}</span>
          <span style={{cursor:"pointer",flexShrink:0}} onClick={onDismissError}><Icon.X size={12} /></span>
        </div>
      )}
    </div>
  );
}

function PageInspector({ paths, onClose }) {
  const [urls, setUrls] = useState(null);
  const [loadError, setLoadError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const resolved = await Promise.all(paths.map((p) => IntakeService.getSignedPageUrl(p)));
        if (!cancelled) setUrls(resolved);
      } catch (e) { if (!cancelled) setLoadError(e.message || "Could not load this page image."); }
    })();
    return () => { cancelled = true; };
  }, [paths]);
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(27,42,74,0.72)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:8,padding:16,maxWidth:"90vw",maxHeight:"90vh",overflow:"auto"}} onClick={(e)=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontFamily:"Inter",fontWeight:600,fontSize:12.5,color:"#1B2A4A"}}>Source page{paths.length>1?"s":""}</span>
          <span style={{cursor:"pointer"}} onClick={onClose}><Icon.X size={16} color="#857F6E" /></span>
        </div>
        {loadError && <div style={{color:"#A8362B",fontSize:12}}>{loadError}</div>}
        {!urls && !loadError && <div style={{fontSize:12,color:"#A6A595"}}><Icon.Loader2 size={14} /> Loading…</div>}
        {urls && urls.map((u, i) => <img key={i} src={u} style={{maxWidth:"80vw",maxHeight:"75vh",display:"block",marginBottom:8,border:"1px solid #E3DDD0"}} />)}
      </div>
    </div>
  );
}

function DocumentGroupCard({ group, docCategories, selectedForMerge, onToggleSelect, onInspect, onSplit, onRetype }) {
  const [splitAt, setSplitAt] = useState("");
  const confidenceColor = group.confidence === "high" ? "#5A8266" : group.confidence === "medium" ? "#B8762E" : "#A8362B";
  return (
    <div style={{background:"#fff",border:`1px solid ${group.status==="needs_review"?"#E8B8B2":"#E3DDD0"}`,borderRadius:6,padding:"10px 12px",marginBottom:8}}>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <input type="checkbox" checked={selectedForMerge} onChange={()=>onToggleSelect(group.groupId)} title="Select for merge" style={{width:14,height:14,accentColor:"#1B2A4A"}} />
        <span style={{fontFamily:"Inter",fontSize:12,fontWeight:600,color:"#1B2A4A"}}>Pages {group.pageRange[0]+1}–{group.pageRange[1]+1}</span>
        <span style={{fontFamily:"Inter",fontSize:9.5,fontWeight:700,letterSpacing:"0.04em",textTransform:"uppercase",color:confidenceColor,border:`1px solid ${confidenceColor}`,borderRadius:10,padding:"1px 7px"}}>{group.confidence}</span>
        {group.status==="needs_review" && <span style={{fontFamily:"Inter",fontSize:9.5,fontWeight:700,color:"#A8362B"}}>NEEDS REVIEW</span>}
        <span style={{marginLeft:"auto",cursor:"pointer",fontSize:11,color:"#857F6E",display:"flex",alignItems:"center",gap:4}} onClick={()=>onInspect(group.sourceImageRefs)}>
          <Icon.Eye size={12} /> Inspect
        </span>
      </div>
      <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <select className="ir-input" style={{fontSize:11.5,padding:"4px 8px",width:"auto",maxWidth:260}} value={group.mappedDocCategory || ""} onChange={(e)=>onRetype(group.groupId, e.target.value)}>
          <option value="">— Unmapped, select a document type —</option>
          {docCategories.map((c) => <option key={c.key} value={c.key}>{c.title}</option>)}
        </select>
        <input type="number" placeholder="Split at page…" className="ir-input" style={{fontSize:11.5,padding:"4px 8px",width:110}} value={splitAt} onChange={(e)=>setSplitAt(e.target.value)} min={group.pageRange[0]+2} max={group.pageRange[1]+1} />
        <button className="ir-btn-ghost" style={{fontSize:11,padding:"4px 9px"}} disabled={!splitAt} onClick={()=>{ onSplit(group.groupId, Number(splitAt)-1); setSplitAt(""); }}>Split</button>
      </div>
      {group.consistencyFlags && group.consistencyFlags.length > 0 && (
        <div style={{marginTop:6,fontSize:10.5,fontFamily:"Inter",color:"#A8362B"}}>
          {group.consistencyFlags.map((f, i) => <div key={i}>• {f.detail}</div>)}
        </div>
      )}
    </div>
  );
}

function UnrecognizedPagesPanel({ pages, docCategories, groups, onAssignExisting, onAssignNew, onKeepUnrecognized, onInspect }) {
  const [choice, setChoice] = useState({});
  if (!pages.length) return null;
  return (
    <div style={{background:"#FBF8F1",border:"1px solid #E3DDD0",borderRadius:6,padding:"10px 12px",marginBottom:12}}>
      <div style={{fontFamily:"Inter",fontWeight:600,fontSize:12,color:"#1B2A4A",marginBottom:6}}>Unrecognized pages ({pages.length})</div>
      {pages.map((p) => {
        const sel = choice[p.pageIndex] || "";
        return (
          <div key={p.pageIndex} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",padding:"6px 0",borderTop:"1px solid #EFEAE0"}}>
            <span style={{fontFamily:"Inter",fontSize:11.5,color:"#3A3528",minWidth:60}}>Page {p.pageIndex+1}</span>
            <span style={{fontSize:10.5,color:"#A6A595"}}>{p.reason==="classification_failed" ? "classification failed — retryable" : "not confidently classified"}</span>
            <span style={{cursor:"pointer",fontSize:11,color:"#857F6E",display:"flex",alignItems:"center",gap:3}} onClick={()=>onInspect([p.sourceImageRef])}><Icon.Eye size={11} /> Inspect</span>
            <select className="ir-input" style={{fontSize:11,padding:"3px 6px",width:"auto",marginLeft:"auto"}} value={sel} onChange={(e)=>setChoice((c)=>({...c,[p.pageIndex]:e.target.value}))}>
              <option value="">Assign to…</option>
              <optgroup label="Existing group">
                {groups.map((g) => <option key={g.groupId} value={`group:${g.groupId}`}>Pages {g.pageRange[0]+1}–{g.pageRange[1]+1} ({g.mappedDocCategory ? docCategories.find(c=>c.key===g.mappedDocCategory)?.title : g.documentTypeId})</option>)}
              </optgroup>
              <optgroup label="New group as">
                {docCategories.map((c) => <option key={c.key} value={`new:${c.key}`}>{c.title}</option>)}
              </optgroup>
            </select>
            <button className="ir-btn-ghost" style={{fontSize:10.5,padding:"3px 8px"}} disabled={!sel} onClick={()=>{
              if (sel.startsWith("group:")) onAssignExisting(p.pageIndex, sel.slice(6));
              else if (sel.startsWith("new:")) onAssignNew(p.pageIndex, sel.slice(4));
              setChoice((c)=>({...c,[p.pageIndex]:""}));
            }}>Apply</button>
            <button className="ir-btn-ghost" style={{fontSize:10.5,padding:"3px 8px"}} onClick={()=>onKeepUnrecognized(p.pageIndex)}>Keep unrecognized</button>
          </div>
        );
      })}
    </div>
  );
}

function IntakeReviewScreen({ session, docCategories, onSessionChange, onRefresh, onConfirm, confirming, confirmResults, onDismiss }) {
  const [selectedForMerge, setSelectedForMerge] = useState([]);
  const [inspecting, setInspecting] = useState(null);
  const [busy, setBusy] = useState(false);
  const [actionError, setActionError] = useState(null);

  const runAction = async (fn) => {
    setBusy(true); setActionError(null);
    try { const updated = await fn(); onSessionChange(updated); }
    catch (e) { setActionError(e.message || "Could not apply this change."); }
    finally { setBusy(false); }
  };

  const toggleSelect = (groupId) => setSelectedForMerge((sel) => sel.includes(groupId) ? sel.filter((g) => g !== groupId) : sel.length < 2 ? [...sel, groupId] : sel);
  const groups = session.document_groups || [];
  const unrecognized = session.unrecognized_pages || [];
  const allResolved = unrecognized.length === 0 && groups.every((g) => g.status !== "needs_review");

  return (
    <div style={{background:"#fff",border:"2px solid #1B2A4A",borderRadius:8,padding:14,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontFamily:"Inter",fontWeight:700,fontSize:12.5,color:"#1B2A4A",textTransform:"uppercase",letterSpacing:"0.03em"}}>Review Combined PDF Intake</div>
          <div style={{fontSize:11,color:"#857F6E",marginTop:2}}>{session.page_count} pages · {groups.length} candidate document{groups.length===1?"":"s"} · {unrecognized.length} unrecognized page{unrecognized.length===1?"":"s"} — nothing below has been added to your case yet.</div>
        </div>
        <span style={{cursor:"pointer"}} onClick={onDismiss} title="Dismiss review"><Icon.X size={16} color="#857F6E" /></span>
      </div>

      {actionError && <div style={{marginBottom:8,padding:"7px 10px",background:"#FBEAE8",border:"1px solid #E8B8B2",borderRadius:4,fontSize:11.5,color:"#A8362B"}}>{actionError}</div>}

      {selectedForMerge.length === 2 && (
        <div style={{marginBottom:8}}>
          <button className="ir-btn-ghost" disabled={busy} onClick={()=>runAction(async()=>{ const r = await IntakeService.mergeGroups(session, selectedForMerge[0], selectedForMerge[1]); setSelectedForMerge([]); return r; })}>
            Merge selected 2 groups
          </button>
        </div>
      )}

      {groups.map((g) => (
        <DocumentGroupCard key={g.groupId} group={g} docCategories={docCategories}
          selectedForMerge={selectedForMerge.includes(g.groupId)} onToggleSelect={toggleSelect}
          onInspect={(paths)=>setInspecting(paths)}
          onSplit={(groupId, splitAtPageIndex)=>runAction(()=>IntakeService.splitGroup(session, groupId, splitAtPageIndex))}
          onRetype={(groupId, newKey)=>runAction(()=>IntakeService.retypeGroup(session, groupId, newKey))}
        />
      ))}

      <UnrecognizedPagesPanel pages={unrecognized} docCategories={docCategories} groups={groups}
        onInspect={(paths)=>setInspecting(paths)}
        onAssignExisting={(pageIndex, groupId)=>runAction(()=>IntakeService.resolveUnrecognizedPage(session, pageIndex, { assignToGroupId: groupId }))}
        onAssignNew={(pageIndex, key)=>runAction(()=>IntakeService.resolveUnrecognizedPage(session, pageIndex, { newDocumentTypeKey: key }))}
        onKeepUnrecognized={(pageIndex)=>runAction(()=>IntakeService.resolveUnrecognizedPage(session, pageIndex, { keepUnrecognized: true }))}
      />

      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}>
        <button className="ir-btn-ghost" onClick={onRefresh} disabled={busy}><Icon.RefreshCw size={12} /> Refresh</button>
        <button className="ir-btn-primary" disabled={busy || confirming || groups.length + unrecognized.length === 0} onClick={onConfirm}>
          {confirming ? <Icon.Loader2 size={12} /> : <Icon.Check size={12} />}
          {confirming ? "Confirming…" : "Confirm & extract into case"}
        </button>
        {!allResolved && <span style={{fontSize:10.5,color:"#B8762E"}}>Some groups still need review — you can confirm anyway, or resolve them first.</span>}
      </div>

      {inspecting && <PageInspector paths={inspecting} onClose={()=>setInspecting(null)} />}
    </div>
  );
}

function App() {
  return <InvestigationReportTool />;
}
